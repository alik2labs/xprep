<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>2048 — xPrep Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f3f3f1; color: #161616; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    body.dark { background: #1a1a1a; color: #e0e0e0; }
    h1 { font-size: 1.1rem; color: #888; margin-bottom: 6px; letter-spacing: 0.12em; }
    .hud { display: flex; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
    .hud-box { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 6px 14px; text-align: center; min-width: 70px; }
    body.dark .hud-box { background: #242424; border-color: #333; }
    .hud-label { font-size: 0.65rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; }
    .hud-value { font-size: 1.1rem; font-weight: bold; color: #161616; }
    body.dark .hud-value { color: #e0e0e0; }
    .btn { background: #161616; color: white; border: none; border-radius: 8px; padding: 7px 20px; font-size: 0.82rem; cursor: pointer; margin-bottom: 8px; }
    body.dark .btn { background: #333; }
    .btn:hover { opacity: 0.8; }
    #msg { font-size: 0.85rem; color: #888; margin-bottom: 8px; height: 20px; text-align: center; }
    canvas { border-radius: 10px; display: block; max-width: 100%; }
    .back { position: fixed; top: 16px; left: 20px; font-size: 0.82rem; color: #888; text-decoration: none; }
    .back:hover { color: #161616; }
    .controls { margin-top: 10px; font-size: 0.75rem; color: #aaa; text-align: center; line-height: 1.8; }
    .dpad { display: none; margin-top: 14px; }
    @media (max-width: 600px) { .dpad { display: block; } .controls { display: none; } }
    .dpad-btn-area { cursor: pointer; }
    .dpad-btn-area:active { opacity: 0.6; }
  </style>
</head>
<body>
<a href="/games/" class="back">Back to Games</a>
<h1>2048</h1>
<div class="hud">
  <div class="hud-box"><div class="hud-label">Score</div><div class="hud-value" id="score">0</div></div>
  <div class="hud-box"><div class="hud-label">Best</div><div class="hud-value" id="best">0</div></div>
  <div class="hud-box"><div class="hud-label">Moves</div><div class="hud-value" id="moves">0</div></div>
</div>
<button class="btn" onclick="resetGame()">New Game</button>
<div id="msg">Use arrow keys or d-pad</div>
<canvas id="c"></canvas>

<div class="dpad">
  <svg id="dpad-svg" width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <rect x="52" y="4" width="56" height="60" rx="14" fill="#161616" class="dpad-btn-area" onclick="move('up')"/>
    <rect x="52" y="96" width="56" height="60" rx="14" fill="#161616" class="dpad-btn-area" onclick="move('down')"/>
    <rect x="4" y="52" width="60" height="56" rx="14" fill="#161616" class="dpad-btn-area" onclick="move('left')"/>
    <rect x="96" y="52" width="60" height="56" rx="14" fill="#161616" class="dpad-btn-area" onclick="move('right')"/>
    <rect x="52" y="52" width="56" height="56" fill="#161616"/>
    <polygon points="80,22 94,42 66,42" fill="#f3f3f1" onclick="move('up')" style="cursor:pointer"/>
    <polygon points="80,138 66,118 94,118" fill="#f3f3f1" onclick="move('down')" style="cursor:pointer"/>
    <polygon points="22,80 42,66 42,94" fill="#f3f3f1" onclick="move('left')" style="cursor:pointer"/>
    <polygon points="138,80 118,66 118,94" fill="#f3f3f1" onclick="move('right')" style="cursor:pointer"/>
  </svg>
</div>

<div class="controls">Arrow keys to move &nbsp; Merge tiles to reach 2048!</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dark = () => document.body.classList.contains("dark");

const SIZE = Math.min(320, window.innerWidth - 40);
canvas.width = SIZE;
canvas.height = SIZE;

const GAP = 8;
const PAD = 10;
const TILE = (SIZE - PAD*2 - GAP*3) / 4;

const COLORS = {
  0:    {bg:"#e0e0e0", fg:"#ccc"},
  2:    {bg:"#f0f0f0", fg:"#555"},
  4:    {bg:"#e0e0e0", fg:"#444"},
  8:    {bg:"#bbb",    fg:"#fff"},
  16:   {bg:"#aaa",   fg:"#fff"},
  32:   {bg:"#999",   fg:"#fff"},
  64:   {bg:"#888",   fg:"#fff"},
  128:  {bg:"#777",   fg:"#fff"},
  256:  {bg:"#666",   fg:"#fff"},
  512:  {bg:"#555",   fg:"#fff"},
  1024: {bg:"#444",   fg:"#fff"},
  2048: {bg:"#161616",fg:"#fff"},
};
const DARK_COLORS = {
  0:    {bg:"#2a2a2a", fg:"#333"},
  2:    {bg:"#3a3a3a", fg:"#aaa"},
  4:    {bg:"#424242", fg:"#bbb"},
  8:    {bg:"#555",    fg:"#fff"},
  16:   {bg:"#666",   fg:"#fff"},
  32:   {bg:"#777",   fg:"#fff"},
  64:   {bg:"#888",   fg:"#fff"},
  128:  {bg:"#999",   fg:"#fff"},
  256:  {bg:"#aaa",   fg:"#fff"},
  512:  {bg:"#bbb",   fg:"#fff"},
  1024: {bg:"#ccc",   fg:"#111"},
  2048: {bg:"#e0e0e0",fg:"#111"},
};

let grid, score, bestScore, moveCount, gameOver, won;

function loadBest() { try { return parseInt(localStorage.getItem("xprep-2048-best"))||0; } catch(e){return 0;} }
function saveBest(v) { try { localStorage.setItem("xprep-2048-best", v); } catch(e){} }

function resetGame() {
  grid = Array.from({length:4},()=>Array(4).fill(0));
  score=0; moveCount=0; gameOver=false; won=false;
  bestScore=loadBest();
  document.getElementById("score").textContent=0;
  document.getElementById("best").textContent=bestScore;
  document.getElementById("moves").textContent=0;
  document.getElementById("msg").textContent="Use arrow keys or d-pad";
  addTile(); addTile();
  draw();
}

function addTile() {
  const empty=[];
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!grid[r][c]) empty.push([r,c]);
  if(!empty.length) return false;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
  return true;
}

function slideRow(row) {
  let arr=row.filter(v=>v), pts=0;
  for(let i=0;i<arr.length-1;i++) {
    if(arr[i]===arr[i+1]) { arr[i]*=2; pts+=arr[i]; arr.splice(i+1,1); if(arr[i]===2048) won=true; }
  }
  while(arr.length<4) arr.push(0);
  return {row:arr,pts};
}

function move(dir) {
  if(gameOver) return;
  let moved=false, pts=0;
  const ng=grid.map(r=>[...r]);
  if(dir==="left") {
    for(let r=0;r<4;r++){const{row,pts:p}=slideRow(grid[r]);if(row.join()!==grid[r].join())moved=true;ng[r]=row;pts+=p;}
  } else if(dir==="right") {
    for(let r=0;r<4;r++){const{row,pts:p}=slideRow([...grid[r]].reverse());const nr=row.reverse();if(nr.join()!==grid[r].join())moved=true;ng[r]=nr;pts+=p;}
  } else if(dir==="up") {
    for(let c=0;c<4;c++){const col=grid.map(r=>r[c]);const{row,pts:p}=slideRow(col);if(row.join()!==col.join())moved=true;row.forEach((v,r)=>{ng[r][c]=v;});pts+=p;}
  } else if(dir==="down") {
    for(let c=0;c<4;c++){const col=grid.map(r=>r[c]).reverse();const{row,pts:p}=slideRow(col);const nr=row.reverse();if(nr.join()!==grid.map(r=>r[c]).join())moved=true;nr.forEach((v,r)=>{ng[r][c]=v;});pts+=p;}
  }
  if(!moved) return;
  grid=ng; score+=pts; moveCount++;
  if(score>bestScore){bestScore=score;saveBest(bestScore);document.getElementById("best").textContent=bestScore;}
  document.getElementById("score").textContent=score;
  document.getElementById("moves").textContent=moveCount;
  if(won&&!gameOver) document.getElementById("msg").textContent="You reached 2048! Keep going!";
  if(!addTile()){
    let can=false;
    for(let r=0;r<4&&!can;r++) for(let c=0;c<4&&!can;c++){
      if(!grid[r][c])can=true;
      if(grid[r][c]===grid[r][c+1])can=true;
      if(grid[r][c]===grid[r+1]?.[c])can=true;
    }
    if(!can){gameOver=true;document.getElementById("msg").textContent="Game Over! Score: "+score;}
  }
  draw();
}

function draw() {
  const colors = dark() ? DARK_COLORS : COLORS;
  ctx.fillStyle = dark() ? "#333" : "#ccc";
  ctx.beginPath();
  ctx.roundRect(0,0,SIZE,SIZE,10);
  ctx.fill();

  for(let r=0;r<4;r++) for(let c=0;c<4;c++) {
    const x = PAD + c*(TILE+GAP);
    const y = PAD + r*(TILE+GAP);
    const v = grid[r][c];
    const col = colors[v] || colors[2048];

    ctx.fillStyle = col.bg;
    ctx.beginPath();
    ctx.roundRect(x, y, TILE, TILE, 6);
    ctx.fill();

    if(v) {
      ctx.fillStyle = col.fg;
      const fs = v>=1024 ? TILE*0.28 : v>=128 ? TILE*0.34 : TILE*0.42;
      ctx.font = `bold ${fs}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(v, x+TILE/2, y+TILE/2);
    }
  }
}

document.addEventListener("keydown", e=>{
  const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};
  if(map[e.key]){e.preventDefault();move(map[e.key]);}
});

let tx=null,ty=null;
canvas.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;e.preventDefault();},{passive:false});
canvas.addEventListener("touchend",e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?"right":"left");
  else move(dy>0?"down":"up");
  tx=null;ty=null;e.preventDefault();
},{passive:false});

if(localStorage.getItem("xprep-theme")==="dark") document.body.classList.add("dark");

// Update dpad colors for dark mode
function updateDpadColors() {
  const fill = dark() ? "#e0e0e0" : "#161616";
  const arrow = dark() ? "#1a1a1a" : "#f3f3f1";
  document.querySelectorAll("#dpad-svg rect").forEach(r=>r.setAttribute("fill",fill));
  document.querySelectorAll("#dpad-svg polygon").forEach(p=>p.setAttribute("fill",arrow));
}
updateDpadColors();

resetGame();
</script>
</body>
</html>
