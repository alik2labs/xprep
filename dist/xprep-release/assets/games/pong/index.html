<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pong — xPrep Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1a; color: #e0e0e0; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { font-size: 1.2rem; color: #aaa; margin-bottom: 8px; letter-spacing: 0.1em; }
    canvas { background: #000; border: 2px solid #333; border-radius: 4px; display: block; max-width: 100%; }
    .score { font-size: 1.5rem; font-weight: bold; letter-spacing: 0.2em; margin-bottom: 12px; color: #e0e0e0; }
    .controls { margin-top: 14px; font-size: 0.78rem; color: #555; text-align: center; line-height: 1.8; }
    .controls span { color: #888; }
    .btn { background: #333; color: #e0e0e0; border: none; border-radius: 8px; padding: 8px 20px; font-size: 0.85rem; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #444; }
    .back { position: fixed; top: 16px; left: 20px; font-size: 0.82rem; color: #555; text-decoration: none; }
    .back:hover { color: #aaa; }
    #msg { font-size: 1rem; color: #5EA259; margin-bottom: 8px; height: 24px; }
  </style>
</head>
<body>
<a href="/games/" class="back">Back to Games</a>
<h1>PONG</h1>
<div class="score"><span id="s1">0</span> &nbsp;:&nbsp; <span id="s2">0</span></div>
<div id="msg">Press Space or tap to start</div>
<canvas id="c" width="700" height="450"></canvas>
<div class="controls">
  <span>Player 1:</span> W / S &nbsp;&nbsp; <span>Player 2:</span> Up / Down &nbsp;&nbsp; <span>Pause:</span> Space<br>
  <span>Mobile:</span> Tap left/right half of screen to move paddles
</div>
<button class="btn" onclick="resetGame()">New Game</button>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const PAD_H = 80, PAD_W = 12, BALL_SIZE = 10, WIN_SCORE = 7;
const SPEED_INIT = 5, SPEED_MAX = 12;

let p1 = {y: H/2 - PAD_H/2, score: 0, dy: 0};
let p2 = {y: H/2 - PAD_H/2, score: 0, dy: 0};
let ball = {x:W/2, y:H/2, vx:SPEED_INIT, vy:3};
let running = false, gameOver = false;
let keys = {};

function resetBall(dir) {
  ball.x = W/2; ball.y = H/2;
  const angle = (Math.random() * 0.6 - 0.3);
  ball.vx = SPEED_INIT * dir;
  ball.vy = SPEED_INIT * Math.sin(angle);
}

function resetGame() {
  p1.y = p2.y = H/2 - PAD_H/2;
  p1.score = p2.score = 0;
  document.getElementById("s1").textContent = 0;
  document.getElementById("s2").textContent = 0;
  document.getElementById("msg").textContent = "Press Space or tap to start";
  gameOver = false; running = false;
  resetBall(1);
  draw();
}

function update() {
  if (!running || gameOver) return;
  const PAD_SPEED = 6;
  if (keys["w"] || keys["W"]) p1.dy = -PAD_SPEED;
  else if (keys["s"] || keys["S"]) p1.dy = PAD_SPEED;
  else p1.dy = 0;
  if (keys["ArrowUp"]) p2.dy = -PAD_SPEED;
  else if (keys["ArrowDown"]) p2.dy = PAD_SPEED;
  else p2.dy = 0;

  p1.y = Math.max(0, Math.min(H - PAD_H, p1.y + p1.dy));
  p2.y = Math.max(0, Math.min(H - PAD_H, p2.y + p2.dy));

  ball.x += ball.vx; ball.y += ball.vy;

  // Wall bounce
  if (ball.y <= 0) { ball.y = 0; ball.vy = Math.abs(ball.vy); }
  if (ball.y >= H - BALL_SIZE) { ball.y = H - BALL_SIZE; ball.vy = -Math.abs(ball.vy); }

  // Paddle collision P1
  if (ball.x <= 30 + PAD_W && ball.x >= 30 && ball.y + BALL_SIZE >= p1.y && ball.y <= p1.y + PAD_H) {
    ball.x = 30 + PAD_W;
    const hit = (ball.y + BALL_SIZE/2 - (p1.y + PAD_H/2)) / (PAD_H/2);
    const speed = Math.min(Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)+0.3, SPEED_MAX);
    ball.vx = Math.abs(speed * Math.cos(hit * 1.2));
    ball.vy = speed * Math.sin(hit * 1.2);
  }
  // Paddle collision P2
  if (ball.x + BALL_SIZE >= W-30-PAD_W && ball.x + BALL_SIZE <= W-30 && ball.y + BALL_SIZE >= p2.y && ball.y <= p2.y + PAD_H) {
    ball.x = W-30-PAD_W-BALL_SIZE;
    const hit = (ball.y + BALL_SIZE/2 - (p2.y + PAD_H/2)) / (PAD_H/2);
    const speed = Math.min(Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)+0.3, SPEED_MAX);
    ball.vx = -Math.abs(speed * Math.cos(hit * 1.2));
    ball.vy = speed * Math.sin(hit * 1.2);
  }

  // Score
  if (ball.x < 0) {
    p2.score++;
    document.getElementById("s2").textContent = p2.score;
    if (p2.score >= WIN_SCORE) { endGame("Player 2 wins!"); return; }
    resetBall(1);
  }
  if (ball.x > W) {
    p1.score++;
    document.getElementById("s1").textContent = p1.score;
    if (p1.score >= WIN_SCORE) { endGame("Player 1 wins!"); return; }
    resetBall(-1);
  }
}

function endGame(msg) {
  gameOver = true; running = false;
  document.getElementById("msg").textContent = msg + " — Press Space to play again";
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  // Center line
  ctx.setLineDash([10,10]);
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);
  // Paddles
  ctx.fillStyle = "#fff";
  ctx.fillRect(30, p1.y, PAD_W, PAD_H);
  ctx.fillRect(W-30-PAD_W, p2.y, PAD_W, PAD_H);
  // Ball
  ctx.fillStyle = "#fff";
  ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.key === " ") {
    e.preventDefault();
    if (gameOver) resetGame();
    else running = !running;
    document.getElementById("msg").textContent = running ? "" : "Paused";
  }
});
document.addEventListener("keyup", e => { keys[e.key] = false; });

// Touch controls
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  if (!running && !gameOver) { running = true; document.getElementById("msg").textContent = ""; return; }
  Array.from(e.touches).forEach(t => {
    const rect = canvas.getBoundingClientRect();
    const x = (t.clientX - rect.left) / rect.width * W;
    const y = (t.clientY - rect.top) / rect.height * H;
    if (x < W/2) p1.y = Math.max(0, Math.min(H-PAD_H, y - PAD_H/2));
    else p2.y = Math.max(0, Math.min(H-PAD_H, y - PAD_H/2));
  });
}, {passive:false});
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  Array.from(e.touches).forEach(t => {
    const rect = canvas.getBoundingClientRect();
    const x = (t.clientX - rect.left) / rect.width * W;
    const y = (t.clientY - rect.top) / rect.height * H;
    if (x < W/2) p1.y = Math.max(0, Math.min(H-PAD_H, y - PAD_H/2));
    else p2.y = Math.max(0, Math.min(H-PAD_H, y - PAD_H/2));
  });
}, {passive:false});

resetGame();
loop();
</script>
</body>
</html>
