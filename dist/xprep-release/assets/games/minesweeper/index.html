<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Minesweeper — xPrep Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f3f3f1; color: #161616; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    body.dark { background: #1a1a1a; color: #e0e0e0; }
    h1 { font-size: 1.1rem; color: #888; margin-bottom: 6px; letter-spacing: 0.12em; }
    .hud { display: flex; gap: 32px; margin-bottom: 10px; font-size: 0.85rem; color: #888; align-items: center; }
    .hud b { color: #161616; }
    body.dark .hud b { color: #e0e0e0; }
    #msg { font-size: 0.9rem; color: #555; margin-bottom: 8px; height: 22px; text-align: center; }
    body.dark #msg { color: #888; }
    canvas { background: #eee; border: 1px solid #ccc; border-radius: 8px; display: block; max-width: 100%; cursor: pointer; }
    body.dark canvas { background: #2a2a2a; border-color: #444; }
    .btn { background: #161616; color: white; border: none; border-radius: 8px; padding: 8px 24px; font-size: 0.85rem; cursor: pointer; margin-top: 12px; }
    body.dark .btn { background: #333; }
    .btn:hover { opacity: 0.8; }
    .back { position: fixed; top: 16px; left: 20px; font-size: 0.82rem; color: #888; text-decoration: none; }
    .back:hover { color: #161616; }
    .controls { margin-top: 10px; font-size: 0.75rem; color: #aaa; text-align: center; line-height: 1.8; }
    .difficulty { display: flex; gap: 8px; margin-bottom: 12px; }
    .diff-btn { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 6px 14px; font-size: 0.78rem; cursor: pointer; color: #555; }
    body.dark .diff-btn { background: #2a2a2a; border-color: #444; color: #888; }
    .diff-btn.active { background: #161616; color: #fff; border-color: #161616; }
    body.dark .diff-btn.active { background: #555; border-color: #555; }
    .diff-btn:hover { border-color: #aaa; }
  </style>
</head>
<body>
<a href="/games/" class="back">Back to Games</a>
<h1>MINESWEEPER</h1>
<div class="difficulty">
  <button class="diff-btn active" onclick="setDiff('easy')">Easy</button>
  <button class="diff-btn" onclick="setDiff('medium')">Medium</button>
  <button class="diff-btn" onclick="setDiff('hard')">Hard</button>
</div>
<div class="hud">Mines: <b id="mines-left">0</b> &nbsp; Time: <b id="timer">0</b>s &nbsp; Flags: <b id="flags">0</b></div>
<div id="msg">Click any cell to start</div>
<canvas id="c"></canvas>
<div class="controls">Left click to reveal &nbsp; Right click / long press to flag</div>
<button class="btn" onclick="resetGame()">New Game</button>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dark = () => document.body.classList.contains("dark");

const DIFFS = {
  easy:   {rows:9,  cols:9,  mines:10},
  medium: {rows:16, cols:16, mines:40},
  hard:   {rows:16, cols:30, mines:99},
};
let diff = "easy";
let {rows,cols,mines} = DIFFS[diff];
const TS = 28;
let grid, revealed, flagged, gameOver, won, firstClick, timerInterval, elapsed, flagCount;

function setDiff(d) {
  diff = d;
  document.querySelectorAll(".diff-btn").forEach(b => b.classList.toggle("active", b.textContent.toLowerCase()===d));
  resetGame();
}

function resetGame() {
  ({rows,cols,mines} = DIFFS[diff]);
  canvas.width = cols*TS;
  canvas.height = rows*TS;
  grid = Array.from({length:rows},()=>Array(cols).fill(0));
  revealed = Array.from({length:rows},()=>Array(cols).fill(false));
  flagged = Array.from({length:rows},()=>Array(cols).fill(false));
  gameOver=false; won=false; firstClick=true; elapsed=0; flagCount=0;
  clearInterval(timerInterval);
  document.getElementById("mines-left").textContent=mines;
  document.getElementById("timer").textContent=0;
  document.getElementById("flags").textContent=0;
  document.getElementById("msg").textContent="Click any cell to start";
  draw();
}

function placeMines(excludeR, excludeC) {
  let placed=0;
  while (placed<mines) {
    const r=Math.floor(Math.random()*rows), c=Math.floor(Math.random()*cols);
    if (grid[r][c]===-1) continue;
    if (Math.abs(r-excludeR)<=1&&Math.abs(c-excludeC)<=1) continue;
    grid[r][c]=-1; placed++;
  }
  // Calculate numbers
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
    if (grid[r][c]===-1) continue;
    let count=0;
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) {
      if (grid[r+dr]?.[c+dc]===-1) count++;
    }
    grid[r][c]=count;
  }
}

function reveal(r,c) {
  if (r<0||r>=rows||c<0||c>=cols||revealed[r][c]||flagged[r][c]) return;
  revealed[r][c]=true;
  if (grid[r][c]===0) {
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) reveal(r+dr,c+dc);
  }
}

function checkWin() {
  let safe=0, rev=0;
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
    if (grid[r][c]!==-1) { safe++; if(revealed[r][c]) rev++; }
  }
  return rev===safe;
}

function handleClick(r,c) {
  if (gameOver||won||flagged[r][c]) return;
  if (firstClick) {
    firstClick=false;
    placeMines(r,c);
    timerInterval=setInterval(()=>{elapsed++;document.getElementById("timer").textContent=elapsed;},1000);
    document.getElementById("msg").textContent="";
  }
  if (grid[r][c]===-1) {
    revealed[r][c]=true;
    gameOver=true;
    clearInterval(timerInterval);
    // Reveal all mines
    for (let rr=0;rr<rows;rr++) for (let cc=0;cc<cols;cc++) if(grid[rr][cc]===-1) revealed[rr][cc]=true;
    document.getElementById("msg").textContent="Boom! Game Over";
    draw(); return;
  }
  reveal(r,c);
  if (checkWin()) {
    won=true; clearInterval(timerInterval);
    document.getElementById("msg").textContent="You win! Time: "+elapsed+"s";
  }
  draw();
}

function handleFlag(r,c) {
  if (gameOver||won||revealed[r][c]) return;
  flagged[r][c]=!flagged[r][c];
  flagCount+=flagged[r][c]?1:-1;
  document.getElementById("flags").textContent=flagCount;
  document.getElementById("mines-left").textContent=mines-flagCount;
  draw();
}

const NUM_COLORS = dark()
  ? ["","#6eb5ff","#90ee90","#ff9999","#9999ff","#ff9944","#7ee8e8","#e0e0e0","#aaa"]
  : ["","#1a56db","#0e7a0e","#c00","#000080","#7b1a00","#0e7a7a","#000","#555"];

function draw() {
  const colors = dark()
    ? ["","#6eb5ff","#90ee90","#ff9999","#9999ff","#ff9944","#7ee8e8","#e0e0e0","#aaa"]
    : ["","#1a56db","#0e7a0e","#c00","#000080","#7b1a00","#0e7a7a","#000","#555"];

  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
    const x=c*TS, y=r*TS;
    if (revealed[r][c]) {
      // Revealed cell
      ctx.fillStyle = dark()?"#222":"#d4d4d4";
      ctx.fillRect(x,y,TS,TS);
      ctx.strokeStyle=dark()?"#333":"#bbb";
      ctx.lineWidth=0.5;
      ctx.strokeRect(x,y,TS,TS);
      if (grid[r][c]===-1) {
        // Mine
        ctx.fillStyle=gameOver?"#555":"#333";
        ctx.beginPath(); ctx.arc(x+TS/2,y+TS/2,TS/2-6,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=dark()?"#888":"#aaa";
        ctx.beginPath(); ctx.arc(x+TS/2-2,y+TS/2-2,3,0,Math.PI*2); ctx.fill();
      } else if (grid[r][c]>0) {
        ctx.fillStyle=colors[grid[r][c]]||"#333";
        ctx.font=`bold ${TS-10}px Arial`;
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(grid[r][c], x+TS/2, y+TS/2+1);
      }
    } else {
      // Hidden cell
      ctx.fillStyle=dark()?"#3a3a3a":"#e0e0e0";
      ctx.fillRect(x,y,TS,TS);
      // 3D border effect
      ctx.fillStyle=dark()?"#4a4a4a":"#f0f0f0";
      ctx.fillRect(x,y,TS,2); ctx.fillRect(x,y,2,TS);
      ctx.fillStyle=dark()?"#2a2a2a":"#bbb";
      ctx.fillRect(x,y+TS-2,TS,2); ctx.fillRect(x+TS-2,y,2,TS);
      if (flagged[r][c]) {
        ctx.fillStyle=dark()?"#e0e0e0":"#161616";
        ctx.font=`${TS-8}px Arial`;
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText("⚑", x+TS/2, y+TS/2+1);
      }
    }
  }
}

canvas.addEventListener("click", e=>{
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
  const c=Math.floor((e.clientX-rect.left)*scaleX/TS);
  const r=Math.floor((e.clientY-rect.top)*scaleY/TS);
  if (r>=0&&r<rows&&c>=0&&c<cols) handleClick(r,c);
});

canvas.addEventListener("contextmenu", e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
  const c=Math.floor((e.clientX-rect.left)*scaleX/TS);
  const r=Math.floor((e.clientY-rect.top)*scaleY/TS);
  if (r>=0&&r<rows&&c>=0&&c<cols) handleFlag(r,c);
});

// Long press for mobile flag
let longPressTimer=null;
canvas.addEventListener("touchstart", e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
  const c=Math.floor((e.touches[0].clientX-rect.left)*scaleX/TS);
  const r=Math.floor((e.touches[0].clientY-rect.top)*scaleY/TS);
  longPressTimer=setTimeout(()=>{ handleFlag(r,c); longPressTimer=null; },500);
},{passive:false});
canvas.addEventListener("touchend", e=>{
  e.preventDefault();
  if (longPressTimer) {
    clearTimeout(longPressTimer); longPressTimer=null;
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
    const c=Math.floor((e.changedTouches[0].clientX-rect.left)*scaleX/TS);
    const r=Math.floor((e.changedTouches[0].clientY-rect.top)*scaleY/TS);
    if (r>=0&&r<rows&&c>=0&&c<cols) handleClick(r,c);
  }
},{passive:false});

if (localStorage.getItem("xprep-theme")==="dark") document.body.classList.add("dark");
resetGame();
</script>
</body>
</html>
