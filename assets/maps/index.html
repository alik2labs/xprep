<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>xPrep Maps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="vendor/leaflet.min.css">
  <script src="vendor/leaflet.min.js"></script>
  <script src="vendor/protomaps-leaflet.js"></script>
  <style>
    @font-face { font-family: "PixelifySans"; src: url("/fonts/PixelifySans-Bold.ttf") format("truetype"); font-weight: 700; }
    html, body { margin:0; padding:0; height:100%; font-family: Arial, sans-serif; background:#1a1a1a; }
    #map { position:absolute; inset:0; }

    #controls {
      position:absolute; top:10px; left:10px; z-index:1000;
      background:white; border-radius:14px; border:1px solid #ddd;
      box-shadow:0 4px 16px rgba(0,0,0,0.15);
      width:260px; overflow:hidden;
      transition:width 0.2s;
    }

    #controls-header {
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 14px; border-bottom:1px solid #eee;
      cursor:pointer; user-select:none;
    }
    #controls-logo {
      font-family: "PixelifySans", Arial, sans-serif;
      font-weight:700; font-size:1.1rem; color:#5EA259;
    }
    #controls-header-right { display:flex; gap:8px; align-items:center; }
    .ctrl-btn {
      background:none; border:1px solid #eee; border-radius:7px;
      padding:4px 7px; cursor:pointer; color:#666; font-size:0.75rem;
      display:flex; align-items:center; gap:3px;
    }
    .ctrl-btn:hover { background:#f5f5f5; border-color:#ccc; }

    #controls-body { padding:12px 14px; }
    #controls-body.collapsed { display:none; }

    #mapSelect {
      width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:8px;
      font-size:0.88rem; background:white; color:#161616; margin-bottom:10px;
      cursor:pointer;
    }
    #mapSelect:focus { outline:none; border-color:#5EA259; }

    .meta-row {
      display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;
    }
    .meta-pill {
      background:#f5f5f5; border-radius:999px; padding:3px 10px;
      font-size:0.75rem; color:#666; border:1px solid #eee;
    }
    .meta-pill b { color:#333; }

    #status { font-size:11px; color:#888; margin-bottom:8px; min-height:14px; }

    .coord-row { display:flex; gap:4px; margin-bottom:10px; }
    .coord-row input {
      flex:1; padding:7px 8px; border:1px solid #ddd; border-radius:8px;
      font-size:0.78rem; color:#161616;
    }
    .coord-row input:focus { outline:none; border-color:#5EA259; }
    .coord-row button {
      background:#161616; color:white; border:none; border-radius:8px;
      padding:7px 10px; font-size:0.78rem; cursor:pointer; white-space:nowrap;
    }
    .coord-row button:hover { background:#333; }

    #controls-back {
      display:block; text-align:center; color:#888; text-decoration:none;
      font-size:0.78rem; padding:6px; border:1px solid #eee; border-radius:8px;
    }
    #controls-back:hover { background:#f5f5f5; color:#333; }

    #noMaps {
      position:absolute; inset:0; display:flex; align-items:center;
      justify-content:center; background:#f3f3f1; z-index:500;
    }
    #noMaps .box {
      background:white; border:1px solid #ddd; border-radius:14px;
      padding:32px 40px; text-align:center; max-width:360px;
    }
    #noMaps h2 { margin:0 0 12px; }
    #noMaps p { color:#555; margin:0 0 20px; line-height:1.5; }
    #noMaps a {
      display:inline-block; background:#151515; color:white;
      padding:12px 20px; border-radius:10px; text-decoration:none; font-weight:bold;
    }

    @media (max-width: 500px) {
      #controls { width: calc(100vw - 20px); }
    }
  </style>
</head>
<body>
  <div id="noMaps" style="display:none;">
    <div class="box">
      <h2>No Maps Installed</h2>
      <p>Download or upload a map file from the admin panel to get started.</p>
      <a href="#" onclick="window.location.href=window.location.protocol+'//'+window.location.hostname+':8080/?tab=maps';return false;">Go to Admin</a>
    </div>
  </div>

  <div id="controls">
    <div id="controls-header" onclick="toggleControls()">
      <span id="controls-logo">xPrep</span>
      <div id="controls-header-right">
        <button class="ctrl-btn" onclick="event.stopPropagation();toggleFullscreen();" title="Fullscreen">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
        </button>
        <button class="ctrl-btn" id="collapse-btn" title="Collapse">&#9660;</button>
      </div>
    </div>
    <div id="controls-body">
      <select id="mapSelect"><option>Loading...</option></select>
      <div class="meta-row" id="map-meta" style="display:none;">
        <span class="meta-pill">Zoom: <b id="zoom-level">-</b></span>
        <span class="meta-pill" id="meta-maxzoom" style="display:none;">Max: <b id="max-zoom-val">-</b></span>
        <span class="meta-pill" id="meta-size" style="display:none;"><b id="map-size-val">-</b></span>
      </div>
      <div id="status">Starting...</div>
      <div class="coord-row">
        <input id="coord-input" type="text" placeholder="lat, lon">
        <button onclick="jumpToCoord()">Go</button>
      </div>
      <a href="/" id="controls-back">&#8592; Back to Home</a>
    </div>
  </div>

  <div id="map"></div>

  <script>
    const select = document.getElementById("mapSelect");
    const statusEl = document.getElementById("status");
    let map = null, currentLayer = null, currentMarker = null;
    let controlsCollapsed = false;
    let mapsData = [];

    function setStatus(msg) { statusEl.textContent = msg; }

    function toggleControls() {
      controlsCollapsed = !controlsCollapsed;
      document.getElementById("controls-body").classList.toggle("collapsed", controlsCollapsed);
      document.getElementById("collapse-btn").innerHTML = controlsCollapsed ? "&#9650;" : "&#9660;";
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function initMap() {
      map = L.map("map", {
        zoomControl: false,
        worldCopyJump: false,
        maxBounds: [[-90, -180], [90, 180]],
        maxBoundsViscosity: 1.0
      });
      L.control.zoom({ position: "topright" }).addTo(map);
      L.control.scale({ position: "bottomright" }).addTo(map);
      map.on("zoom", () => {
        document.getElementById("zoom-level").textContent = map.getZoom();
      });
    }

    async function loadMap(filename) {
      if (!map) initMap();
      setStatus("Loading...");
      const url = "http://" + location.hostname + "/maps/data/" + filename;
      try {
        if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; }
        const isBase = filename === "base.pmtiles";
        currentLayer = protomapsL.leafletLayer({ url: url, flavor: "light", lang: "en", noWrap: true });
        currentLayer.addTo(map);

        const metaRes = await fetch("/api/maps/info?file=" + encodeURIComponent(filename));
        if (metaRes.ok) {
          const meta = await metaRes.json();
          if (isBase || !meta.bounds) {
            map.setView([20, 0], 2);
          } else {
            map.fitBounds([
              [meta.bounds[1], meta.bounds[0]],
              [meta.bounds[3], meta.bounds[2]]
            ], { padding: [40, 40], maxZoom: 12 });
          }
        } else {
          map.setView([20, 0], 2);
        }

        // Show metadata
        const mapInfo = mapsData.find(m => m.filename === filename);
        if (mapInfo) {
          document.getElementById("map-meta").style.display = "flex";
          document.getElementById("meta-maxzoom").style.display = "inline-block";
          document.getElementById("max-zoom-val").textContent = mapInfo.zoom !== "-" ? mapInfo.zoom : "?";
          document.getElementById("meta-size").style.display = "inline-block";
          document.getElementById("map-size-val").textContent = mapInfo.size;
        }

        document.getElementById("zoom-level").textContent = map.getZoom();
        setStatus("Loaded: " + (mapInfo ? mapInfo.name : filename));
      } catch(err) {
        setStatus("Error: " + err.message);
      }
    }

    function jumpToCoord() {
      if (!map) return;
      const val = document.getElementById("coord-input").value.trim();
      const parts = val.split(/[,\s]+/).map(Number).filter(n => !isNaN(n));
      if (parts.length < 2) { setStatus("Invalid coordinates"); return; }
      const [lat, lng] = parts;
      if (lat < -90 || lat > 90 || lng < -180 || lng > 180) { setStatus("Out of range"); return; }
      map.flyTo([lat, lng], 14);
      if (currentMarker) map.removeLayer(currentMarker);
      currentMarker = L.circleMarker([lat, lng], {
        radius: 8, fillColor: "#5EA259", fillOpacity: 1, color: "white", weight: 3
      }).addTo(map);
      setStatus("Jumped to " + lat.toFixed(4) + ", " + lng.toFixed(4));
    }

    document.getElementById("coord-input").addEventListener("keydown", e => {
      if (e.key === "Enter") jumpToCoord();
    });

    async function init() {
      try {
        const res = await fetch("/api/maps/list?t=" + Date.now());
        const data = await res.json();
        mapsData = data.maps || [];
        select.innerHTML = "";
        if (!mapsData.length) {
          document.getElementById("noMaps").style.display = "flex";
          document.getElementById("controls").style.display = "none";
          return;
        }
        mapsData.sort((a, b) => a.deletable === b.deletable ? 0 : a.deletable ? 1 : -1);
        mapsData.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.filename;
          opt.textContent = m.name;
          select.appendChild(opt);
        });
        select.addEventListener("change", () => loadMap(select.value));
        loadMap(mapsData[0].filename);
      } catch(err) {
        setStatus("Init error: " + err);
      }
    }

    init();
  </script>
</body>
</html>
