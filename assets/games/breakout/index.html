<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Breakout — xPrep Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f3f3f1; color: #161616; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    body.dark { background: #1a1a1a; color: #e0e0e0; }
    h1 { font-size: 1.1rem; color: #888; margin-bottom: 6px; letter-spacing: 0.12em; font-family: Arial, sans-serif; }
    canvas { background: #fff; border: 1px solid #ddd; border-radius: 8px; display: block; max-width: 100%; }
    body.dark canvas { background: #111; border-color: #333; }
    .hud { display: flex; gap: 32px; margin-bottom: 10px; font-size: 0.85rem; color: #888; }
    .hud b { color: #161616; }
    body.dark .hud b { color: #e0e0e0; }
    #msg { font-size: 0.9rem; color: #555; margin-bottom: 8px; height: 22px; text-align: center; }
    body.dark #msg { color: #888; }
    .btn { background: #161616; color: white; border: none; border-radius: 8px; padding: 8px 24px; font-size: 0.85rem; cursor: pointer; margin-top: 12px; }
    body.dark .btn { background: #333; }
    .btn:hover { opacity: 0.8; }
    .back { position: fixed; top: 16px; left: 20px; font-size: 0.82rem; color: #888; text-decoration: none; }
    .back:hover { color: #161616; }
    .controls { margin-top: 10px; font-size: 0.75rem; color: #aaa; text-align: center; }
  </style>
</head>
<body>
<a href="/games/" class="back">Back to Games</a>
<h1>BREAKOUT</h1>
<div class="hud">Score: <b id="score">0</b> &nbsp; Lives: <b id="lives">3</b> &nbsp; Level: <b id="level">1</b></div>
<div id="msg">Press Space or tap to launch</div>
<canvas id="c" width="480" height="400"></canvas>
<div class="controls">Mouse / touch to move paddle &nbsp; Space to launch</div>
<button class="btn" onclick="resetGame()">New Game</button>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const PAD_W = 80, PAD_H = 10, BALL_R = 7;
const BRICK_ROWS = 5, BRICK_COLS = 10, BRICK_W = 44, BRICK_H = 16, BRICK_PAD = 4;
const BRICK_OFF_X = 8, BRICK_OFF_Y = 40;

let pad, ball, bricks, score, lives, level, launched, gameOver;
const dark = () => document.body.classList.contains("dark");

function makeBricks() {
  const b = [];
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      b.push({x: BRICK_OFF_X + c*(BRICK_W+BRICK_PAD), y: BRICK_OFF_Y + r*(BRICK_H+BRICK_PAD), alive: true, row: r});
    }
  }
  return b;
}

function resetGame() {
  pad = {x: W/2 - PAD_W/2, y: H - 30};
  ball = {x: W/2, y: H - 50, vx: 0, vy: 0};
  bricks = makeBricks();
  score = 0; lives = 3; level = 1; launched = false; gameOver = false;
  document.getElementById("score").textContent = 0;
  document.getElementById("lives").textContent = 3;
  document.getElementById("level").textContent = 1;
  document.getElementById("msg").textContent = "Press Space or tap to launch";
  draw();
}

function launch() {
  if (launched) return;
  launched = true;
  const speed = 4 + level * 0.5;
  ball.vx = (Math.random() > 0.5 ? 1 : -1) * speed * 0.7;
  ball.vy = -speed;
  document.getElementById("msg").textContent = "";
}

function update() {
  if (!launched || gameOver) return;
  ball.x += ball.vx; ball.y += ball.vy;
  // Wall bounce
  if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
  if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }
  // Paddle
  if (ball.y + BALL_R >= pad.y && ball.y - BALL_R <= pad.y + PAD_H &&
      ball.x >= pad.x && ball.x <= pad.x + PAD_W) {
    ball.vy = -Math.abs(ball.vy);
    const hit = (ball.x - (pad.x + PAD_W/2)) / (PAD_W/2);
    ball.vx = hit * 5;
  }
  // Bottom
  if (ball.y + BALL_R > H) {
    lives--;
    document.getElementById("lives").textContent = lives;
    if (lives <= 0) { gameOver = true; document.getElementById("msg").textContent = "Game Over! Score: "+score+" — Space to restart"; return; }
    launched = false;
    ball = {x: pad.x + PAD_W/2, y: pad.y - BALL_R - 2, vx:0, vy:0};
    document.getElementById("msg").textContent = "Press Space or tap to launch";
  }
  // Bricks
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + BRICK_W &&
        ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + BRICK_H) {
      b.alive = false;
      score += (BRICK_ROWS - b.row) * 10;
      document.getElementById("score").textContent = score;
      // Determine bounce direction
      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + BRICK_W - ball.x + BALL_R);
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + BRICK_H - ball.y + BALL_R);
      if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
      break;
    }
  }
  // Level clear
  if (bricks.every(b => !b.alive)) {
    level++;
    document.getElementById("level").textContent = level;
    bricks = makeBricks();
    launched = false;
    ball = {x: pad.x + PAD_W/2, y: pad.y - BALL_R - 2, vx:0, vy:0};
    document.getElementById("msg").textContent = "Level "+level+"! Press Space to continue";
  }
  // Keep ball on paddle when not launched
  if (!launched) ball.x = pad.x + PAD_W/2;
}

function draw() {
  ctx.fillStyle = dark() ? "#111" : "#fff";
  ctx.fillRect(0, 0, W, H);
  // Bricks
  const shades = dark()
    ? ["#555","#4a4a4a","#3f3f3f","#343434","#2a2a2a"]
    : ["#161616","#333","#555","#777","#999"];
  bricks.forEach(b => {
    if (!b.alive) return;
    ctx.fillStyle = shades[b.row];
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, BRICK_W, BRICK_H, 3);
    ctx.fill();
  });
  // Paddle
  ctx.fillStyle = dark() ? "#e0e0e0" : "#161616";
  ctx.beginPath();
  ctx.roundRect(pad.x, pad.y, PAD_W, PAD_H, 4);
  ctx.fill();
  // Ball
  ctx.fillStyle = dark() ? "#e0e0e0" : "#161616";
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fill();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// Controls
canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * W;
  pad.x = Math.max(0, Math.min(W - PAD_W, x - PAD_W/2));
  if (!launched) ball.x = pad.x + PAD_W/2;
});
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches[0].clientX - rect.left) / rect.width * W;
  pad.x = Math.max(0, Math.min(W - PAD_W, x - PAD_W/2));
  if (!launched) ball.x = pad.x + PAD_W/2;
}, {passive:false});
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  if (!launched && !gameOver) launch();
}, {passive:false});
document.addEventListener("keydown", e => {
  if (e.key === " ") {
    e.preventDefault();
    if (gameOver) { resetGame(); return; }
    launch();
  }
});

resetGame();
loop();
</script>
</body>
</html>
