<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bloom Library — xPrep</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/bloom/epub.min.js"></script>
  <style>
    @font-face { font-family: "PixelifySans"; src: url("/fonts/PixelifySans-Bold.ttf") format("truetype"); font-weight: 700; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f3f3f1; color: #161616; min-height: 100vh; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; background: white; border: 1px solid #ddd; border-radius: 14px; padding: 20px 24px; flex-wrap: wrap; margin-bottom: 20px; position: relative; }
    .header-left h1 { font-family: "PixelifySans", Arial, sans-serif; font-weight: 700; font-size: 2.2rem; color: #5EA259; line-height: 1; }
    .header-left p { font-size: 0.82rem; color: #aaa; margin-top: 4px; }
    .back-link { color: #555; text-decoration: none; font-size: 0.88rem; font-weight: bold; }
    .back-link:hover { color: #161616; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 8px 20px; font-size: 0.9rem; cursor: pointer; color: #555; }
    .tab-btn.active { background: #161616; color: white; border-color: #161616; }
    .tab-btn:hover:not(.active) { background: #f5f5f5; }

    .filter-bar { background: white; border: 1px solid #ddd; border-radius: 14px; padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
    .filter-group label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
    .filter-group select, .filter-group input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.88rem; background: white; color: #161616; }
    .filter-group select:focus, .filter-group input:focus { outline: none; border-color: #5EA259; }
    .filter-btn { background: #161616; color: white; border: none; border-radius: 8px; padding: 9px 20px; font-size: 0.88rem; cursor: pointer; white-space: nowrap; align-self: flex-end; }
    .filter-btn:hover { background: #333; }

    .status-bar { font-size: 0.85rem; color: #888; margin-bottom: 16px; min-height: 20px; }
    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .book-card { background: white; border: 1px solid #ddd; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .book-thumb { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #f5f5f5; }
    .book-thumb-placeholder { width: 100%; aspect-ratio: 4/3; background: linear-gradient(135deg, #e8f5e9, #c8e6c9); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
    .book-info { padding: 10px 12px; flex: 1; }
    .book-title { font-size: 0.85rem; font-weight: bold; color: #161616; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
    .book-meta { font-size: 0.72rem; color: #888; }
    .book-level { display: inline-block; background: #f0f9f0; color: #5EA259; border: 1px solid #c8e6c9; border-radius: 999px; padding: 1px 8px; font-size: 0.68rem; margin-top: 4px; }
    .book-saved-badge { display: inline-block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; border-radius: 999px; padding: 1px 8px; font-size: 0.68rem; margin-top: 4px; margin-left: 4px; }
    .book-summary { font-size: 0.72rem; color: #666; margin-top: 4px; line-height: 1.4; display: none; }
    .book-card:hover .book-summary { display: block; }
    .book-license { font-size: 0.65rem; color: #aaa; margin-top: 2px; }
    .book-actions { padding: 8px 12px; border-top: 1px solid #eee; display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-read { flex: 1; background: #5EA259; color: white; border: none; border-radius: 6px; padding: 6px 8px; font-size: 0.75rem; cursor: pointer; }
    .btn-read:hover { background: #4a8a46; }
    .btn-save { background: #161616; color: white; border: none; border-radius: 6px; padding: 6px 8px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; }
    .btn-save:hover { background: #333; }
    .btn-save.saved { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .btn-del { background: #fff3f3; color: #c62828; border: 1px solid #ffcdd2; border-radius: 6px; padding: 6px 8px; font-size: 0.75rem; cursor: pointer; }
    .btn-del:hover { background: #ffcdd2; }

    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
    .page-btn { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 8px 14px; font-size: 0.85rem; cursor: pointer; }
    .page-btn:hover, .page-btn.active { background: #5EA259; color: white; border-color: #5EA259; }

    .loading { text-align: center; padding: 40px; color: #888; }
    .offline-msg { background: #fff8e1; border: 1px solid #ffe082; border-radius: 10px; padding: 12px 16px; color: #f57f17; margin-bottom: 16px; font-size: 0.88rem; }

    /* ePUB Reader Modal */
    .reader-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; flex-direction: column; }
    .reader-overlay.open { display: flex; }
    .reader-header { background: #161616; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-shrink: 0; }
    .reader-title { font-size: 0.95rem; font-weight: bold; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reader-close { background: none; border: 1px solid #555; color: white; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 0.85rem; }
    .reader-close:hover { background: #333; }
    .reader-body { flex: 1; display: flex; align-items: stretch; overflow: hidden; }
    .reader-prev, .reader-next { background: rgba(255,255,255,0.1); border: none; color: white; font-size: 1.5rem; padding: 0 20px; cursor: pointer; flex-shrink: 0; }
    .reader-prev:hover, .reader-next:hover { background: rgba(255,255,255,0.2); }
    #reader-area { flex: 1; background: white; }
    .reader-footer { background: #161616; color: #888; padding: 8px 20px; font-size: 0.78rem; text-align: center; flex-shrink: 0; }

    #theme-toggle { position: fixed; top: 12px; right: 12px; z-index: 999; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 6px 8px; cursor: pointer; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    body.dark { background: #1a1a1a; color: #e0e0e0; }
    body.dark header, body.dark .filter-bar, body.dark .book-card { background: #242424; border-color: #333; }
    body.dark .book-title { color: #e0e0e0; }
    body.dark .filter-group select, body.dark .filter-group input { background: #1a1a1a; border-color: #444; color: #e0e0e0; }
    body.dark .book-actions { border-top-color: #333; }
    body.dark .tab-btn { background: #242424; border-color: #444; color: #ccc; }
    body.dark .tab-btn.active { background: #5EA259; border-color: #5EA259; color: white; }
    body.dark .page-btn { background: #242424; border-color: #444; color: #ccc; }
    body.dark #theme-toggle { background: #242424; border-color: #444; }

    @media (max-width: 600px) { .books-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
<button id="theme-toggle" onclick="toggleTheme()">
  <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
</button>

<!-- ePUB Reader Modal -->
<div class="reader-overlay" id="reader-overlay">
  <div class="reader-header">
    <span class="reader-title" id="reader-title">Loading...</span>
    <button class="reader-close" onclick="closeReader()">&#10005; Close</button>
  </div>
  <div class="reader-body">
    <button class="reader-prev" onclick="readerPrev()">&#8249;</button>
    <div id="reader-area"></div>
    <button class="reader-next" onclick="readerNext()">&#8250;</button>
  </div>
  <div class="reader-footer" id="reader-footer">Loading book...</div>
</div>

<div class="wrap">
  <header>
    <div class="header-left">
      <h1>xPrep</h1>
      <p>Bloom Library — Free Books for Children</p>
    </div>
    <div style="position:absolute;left:50%;transform:translateX(-50%);font-family:Arial,sans-serif;font-size:1.1rem;color:#888;font-weight:bold;white-space:nowrap;">Bloom Library</div>
    <div>
      <a href="/" class="back-link">Back to Home</a>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-browse" onclick="showTab('browse')">&#127760; Browse Online</button>
    <button class="tab-btn" id="tab-saved" onclick="showTab('saved')">&#128197; My Books <span id="saved-count" style="background:#5EA259;color:white;border-radius:999px;padding:1px 7px;font-size:0.75rem;margin-left:4px;">0</span></button>
  </div>

  <!-- BROWSE TAB -->
  <div id="browse-tab">
    <div class="filter-bar">
      <div class="filter-group">
        <label>Language</label>
        <select id="filter-lang">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="ar">Arabic</option>
          <option value="hi">Hindi</option>
          <option value="sw">Swahili</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
          <option value="ur">Urdu</option>
          <option value="bn">Bengali</option>
          <option value="id">Indonesian</option>
          <option value="tl">Filipino</option>
          <option value="ha">Hausa</option>
          <option value="ne">Nepali</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Topic</label>
        <select id="filter-topic">
          <option value="">All Topics</option>
          <option value="story book">Story Books</option>
          <option value="animal stories">Animal Stories</option>
          <option value="health">Health</option>
          <option value="agriculture">Agriculture</option>
          <option value="community living">Community Living</option>
          <option value="environment">Environment</option>
          <option value="science">Science</option>
          <option value="math">Math</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Reading Level</label>
        <select id="filter-level">
          <option value="">All Levels</option>
          <option value="first words">First Words</option>
          <option value="first sentences">First Sentences</option>
          <option value="first paragraphs">First Paragraphs</option>
          <option value="longer paragraphs">Longer Paragraphs</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Search</label>
        <input type="text" id="filter-search" placeholder="Search titles...">
      </div>
      <button class="filter-btn" onclick="loadBooks(1)">Search</button>
    </div>
    <div id="browse-status" class="status-bar"></div>
    <div id="offline-box" class="offline-msg" style="display:none;">&#9888; No internet — showing offline books only in My Books tab.</div>
    <div id="browse-container"><div class="loading">Loading books from Bloom Library...</div></div>
    <div class="pagination" id="browse-pagination"></div>
  </div>

  <!-- MY BOOKS TAB -->
  <div id="saved-tab" style="display:none;">
    <div id="saved-status" class="status-bar"></div>
    <div id="saved-container"><div class="loading">Loading saved books...</div></div>
  </div>
</div>

<script>
// Theme
if (localStorage.getItem("xprep-theme") === "dark") document.body.classList.add("dark");
function toggleTheme() {
  const dark = document.body.classList.toggle("dark");
  localStorage.setItem("xprep-theme", dark ? "dark" : "light");
  document.getElementById("icon-sun").style.display = dark ? "block" : "none";
  document.getElementById("icon-moon").style.display = dark ? "none" : "block";
}
(function() {
  const dark = document.body.classList.contains("dark");
  document.getElementById("icon-sun").style.display = dark ? "block" : "none";
  document.getElementById("icon-moon").style.display = dark ? "none" : "block";
})();

// ePUB Reader
let book = null, rendition = null;

function openReader(slug, title) {
  document.getElementById("reader-overlay").classList.add("open");
  document.getElementById("reader-title").textContent = title;
  document.getElementById("reader-footer").textContent = "Loading...";
  document.getElementById("reader-area").innerHTML = "";

  // Use epub file server - epub.js fetches individual files via HTTP
  const url = "/api/bloom/epub/" + slug + "/";
  book = ePub(url);
  rendition = book.renderTo("reader-area", {
    width: "100%", height: "100%", spread: "none", flow: "paginated",
    allowScriptedContent: true
  });

  book.ready.then(() => {
    rendition.display();
    document.getElementById("reader-footer").textContent = title;
  }).catch(err => {
    document.getElementById("reader-footer").textContent = "Error loading book: " + err.message;
  });

  rendition.on("locationChanged", loc => {
    try {
      if (book.locations && book.locations.total > 0) {
        const pct = Math.round(book.locations.percentageFromCfi(loc.start.cfi) * 100);
        document.getElementById("reader-footer").textContent = pct + "% — " + title;
      }
    } catch(e) {}
  });

  rendition.on("rendered", () => {
    book.locations.generate(1024);
  });
}

function closeReader() {
  document.getElementById("reader-overlay").classList.remove("open");
  if (book) { book.destroy(); book = null; rendition = null; }
}

function readerPrev() { if (rendition) rendition.prev(); }
function readerNext() { if (rendition) rendition.next(); }

// Keyboard navigation
document.addEventListener("keydown", e => {
  if (!document.getElementById("reader-overlay").classList.contains("open")) return;
  if (e.key === "ArrowRight") readerNext();
  if (e.key === "ArrowLeft") readerPrev();
  if (e.key === "Escape") closeReader();
});

// Tabs
function showTab(tab) {
  document.getElementById("browse-tab").style.display = tab === "browse" ? "block" : "none";
  document.getElementById("saved-tab").style.display = tab === "saved" ? "block" : "none";
  document.getElementById("tab-browse").classList.toggle("active", tab === "browse");
  document.getElementById("tab-saved").classList.toggle("active", tab === "saved");
  if (tab === "saved") loadSaved();
}

// Book store - keyed by slug to avoid passing complex objects in onclick
const bookStore = {};

// Book card HTML
function bookCardHTML(b, offline) {
  const slug = slugify(b.title || b.slug || "book");
  bookStore[slug] = b;
  const thumb = b.thumbnail
    ? `<img class="book-thumb" src="${b.thumbnail}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : "";
  const placeholder = `<div class="book-thumb-placeholder" ${b.thumbnail ? "style='display:none'" : ""}>📚</div>`;
  const level = b.level ? `<span class="book-level">${b.level}</span>` : "";
  const savedBadge = b.saved ? `<span class="book-saved-badge">&#10003; Saved</span>` : "";

  let actions = "";
  if (offline) {
    actions = `<button class="btn-read" onclick="openReader('${slug}','${(b.title||"").replace(/'/g,"\'")}')">&#128214; Read</button>
               <button class="btn-del" onclick="deleteBook('${slug}')">&#128465;</button>`;
  } else {
    const saveBtn = !b.epub
      ? ""
      : b.saved
        ? `<button class="btn-save saved" disabled>&#10003; Saved</button>`
        : `<button class="btn-save" onclick="saveBookBySlug('${slug}')">&#8659; Save</button>`;
    const readBtn = b.epub
      ? `<button class="btn-read" onclick="openReader('${slug}','${(b.title||"").replace(/'/g,"\'")}')">&#128214; Read</button>`
      : "";
    actions = `${readBtn}${saveBtn}`;
  }

  return `<div class="book-card" id="card-${slug}">
    ${thumb}${placeholder}
    <div class="book-info">
      <div class="book-title">${b.title || "Untitled"}</div>
      <div class="book-meta">${b.subject || ""}</div>
      ${level}${savedBadge}
      ${b.summary ? `<div class="book-summary">${b.summary}</div>` : ""}
      ${b.license ? `<div class="book-license">${b.license}</div>` : ""}
    </div>
    <div class="book-actions">${actions}</div>
  </div>`;
}

function saveBookBySlug(slug) {
  const b = bookStore[slug];
  if (b) saveBook(b);
}

function slugify(title) {
  return title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").substring(0, 60) || "book";
}

// Browse
const PAGE_SIZE = 24;
let allBooks = [], filteredBooks = [], currentPage = 1;

async function loadBooks(page) {
  currentPage = page || 1;
  document.getElementById("browse-container").innerHTML = "<div class='loading'>Loading books...</div>";
  document.getElementById("browse-pagination").innerHTML = "";
  document.getElementById("offline-box").style.display = "none";

  const lang = document.getElementById("filter-lang").value;
  try {
    const res = await fetch(`/api/bloom/books?lang=${lang}`);
    const data = await res.json();
    allBooks = data.books || [];
    filteredBooks = applyFilters(allBooks);
    document.getElementById("browse-status").textContent =
      `Showing ${filteredBooks.length} of ${allBooks.length} books`;
    renderBrowse(currentPage);
  } catch(err) {
    document.getElementById("offline-box").style.display = "block";
    document.getElementById("browse-container").innerHTML = "<div class='loading'>Could not reach Bloom Library. Check your internet connection.</div>";
  }
}

function applyFilters(books) {
  const topic = document.getElementById("filter-topic").value.toLowerCase();
  const level = document.getElementById("filter-level").value.toLowerCase();
  const search = document.getElementById("filter-search").value.toLowerCase();
  return books.filter(b => {
    if (topic && !(b.subject || "").toLowerCase().includes(topic)) return false;
    if (level && (b.level || "").toLowerCase() !== level) return false;
    if (search && !(b.title || "").toLowerCase().includes(search)) return false;
    return true;
  });
}

function renderBrowse(page) {
  const start = (page - 1) * PAGE_SIZE;
  const pageBooks = filteredBooks.slice(start, start + PAGE_SIZE);
  if (!pageBooks.length) {
    document.getElementById("browse-container").innerHTML = "<div class='loading'>No books found.</div>";
    return;
  }
  document.getElementById("browse-container").innerHTML =
    "<div class='books-grid'>" + pageBooks.map(b => bookCardHTML(b, false)).join("") + "</div>";
  renderPagination(filteredBooks.length, page);
}

function renderPagination(total, page) {
  const pages = Math.ceil(total / PAGE_SIZE);
  const el = document.getElementById("browse-pagination");
  if (pages <= 1) { el.innerHTML = ""; return; }
  let html = "";
  const start = Math.max(1, page - 3);
  const end = Math.min(pages, page + 3);
  if (start > 1) html += `<button class="page-btn" onclick="goPage(1)">1</button><span style="padding:8px">...</span>`;
  for (let i = start; i <= end; i++)
    html += `<button class="page-btn ${i === page ? "active" : ""}" onclick="goPage(${i})">${i}</button>`;
  if (end < pages) html += `<span style="padding:8px">...</span><button class="page-btn" onclick="goPage(${pages})">${pages}</button>`;
  el.innerHTML = html;
}

function goPage(p) { currentPage = p; renderBrowse(p); window.scrollTo(0,0); }

// Save / Delete
async function saveBook(book) {
  const slug = slugify(book.title || "book");
  const card = document.getElementById("card-" + slug);
  const btn = card ? card.querySelector(".btn-save") : null;
  if (btn) { btn.textContent = "Saving..."; btn.disabled = true; }

  try {
    const res = await fetch("/api/bloom/save", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(book)
    });
    const data = await res.json();
    if (data.ok) {
      if (btn) { btn.textContent = "✓ Saved"; btn.className = "btn-save saved"; }
      updateSavedCount();
    } else {
      if (btn) { btn.textContent = "Failed"; btn.disabled = false; }
      alert("Save failed: " + (data.error || "unknown error"));
    }
  } catch(e) {
    if (btn) { btn.textContent = "Error"; btn.disabled = false; }
    alert("Could not save: " + e.message);
  }
}

async function deleteBook(slug) {
  if (!confirm("Remove this book from offline storage?")) return;
  await fetch("/api/bloom/delete", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({slug})
  });
  loadSaved();
  updateSavedCount();
}

async function loadSaved() {
  document.getElementById("saved-container").innerHTML = "<div class='loading'>Loading saved books...</div>";
  try {
    const res = await fetch("/api/bloom/saved");
    const data = await res.json();
    const books = data.books || [];
    document.getElementById("saved-status").textContent =
      `${books.length} book${books.length !== 1 ? "s" : ""} saved for offline reading`;
    document.getElementById("saved-count").textContent = books.length;
    if (!books.length) {
      document.getElementById("saved-container").innerHTML =
        "<div class='loading'>No books saved yet. Browse books and click Save to read them offline.</div>";
      return;
    }
    document.getElementById("saved-container").innerHTML =
      "<div class='books-grid'>" + books.map(b => bookCardHTML(b, true)).join("") + "</div>";
  } catch(e) {
    document.getElementById("saved-container").innerHTML = "<div class='loading'>Error loading saved books.</div>";
  }
}

async function updateSavedCount() {
  try {
    const res = await fetch("/api/bloom/saved");
    const data = await res.json();
    document.getElementById("saved-count").textContent = (data.books || []).length;
  } catch(e) {}
}

// Filters
["filter-topic", "filter-level"].forEach(id => {
  document.getElementById(id).addEventListener("change", () => {
    filteredBooks = applyFilters(allBooks);
    document.getElementById("browse-status").textContent =
      `Showing ${filteredBooks.length} of ${allBooks.length} books`;
    renderBrowse(1); currentPage = 1;
  });
});
document.getElementById("filter-search").addEventListener("keydown", e => {
