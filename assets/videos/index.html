<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Videos — xPrep</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @font-face { font-family: 'PixelifySans'; src: url('/fonts/PixelifySans-Bold.ttf') format('truetype'); font-weight: 700; }
    @font-face { font-family: 'PixelifySans'; src: url('/fonts/PixelifySans-Regular.ttf') format('truetype'); font-weight: 400; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f3f3f1; color: #161616; min-height: 100vh; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 20px; background: white; border: 1px solid #ddd;
      border-radius: 14px; padding: 20px 24px; flex-wrap: wrap;
      margin-bottom: 20px; position: relative;
    }
    .header-left h1 { font-family: 'PixelifySans', Arial, sans-serif; font-weight: 700; font-size: 2.2rem; color: #5EA259; line-height: 1; }
    .header-left p { font-size: 0.82rem; color: #aaa; margin-top: 4px; }
    .header-right { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
    .stat-block { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .stat-label { font-size: 0.72rem; color: #bbb; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 0.88rem; color: #555; font-weight: bold; }

    #player-section {
      display: none; background: #111; border-radius: 14px;
      padding: 16px; margin-bottom: 20px; border: 1px solid #222;
    }
    #player-section video { width: 100%; max-height: 60vh; display: block; border-radius: 8px; }
    #now-playing { margin-top: 10px; font-size: 0.9rem; font-weight: bold; color: #fff; }
    #close-player {
      margin-top: 8px; background: #333; color: #eee; border: none;
      border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 0.85rem;
    }
    #close-player:hover { background: #555; }

    .search-bar { margin-bottom: 16px; }
    .search-bar input {
      width: 100%; max-width: 400px; padding: 10px 14px;
      border-radius: 8px; border: 1px solid #ddd;
      background: white; color: #161616; font-size: 0.9rem;
    }
    .search-bar input:focus { outline: none; border-color: #5EA259; }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .card {
      background: white; border-radius: 14px; overflow: hidden;
      cursor: pointer; border: 1px solid #ddd;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.07); border-color: #bbb; }
    .card-thumb {
      width: 100%; aspect-ratio: 16/9; background: #f3f3f1;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
    .card-info { padding: 10px 12px; }
    .card-title { font-size: 0.85rem; font-weight: bold; color: #161616; line-height: 1.3; margin-bottom: 4px; }
    .card-ext { font-size: 0.72rem; color: #aaa; text-transform: uppercase; }

    #empty { display: none; text-align: center; padding: 60px 20px; color: #aaa; }
    #empty svg { margin-bottom: 12px; }
    #loading { text-align: center; padding: 40px; color: #aaa; font-size: 0.9rem; }

    #theme-toggle {
      background: white; border: 1px solid #ddd; border-radius: 8px;
      padding: 6px 8px; cursor: pointer; color: #888;
      display: flex; align-items: center; justify-content: center;
      position: fixed; top: 16px; right: 20px; z-index: 999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    #theme-toggle:hover { border-color: #aaa; }
    body.dark #theme-toggle { background: #242424; border-color: #444; color: #ccc; }
    body.dark #theme-toggle svg { stroke: #ccc; }
    #theme-toggle svg { stroke: #888; }

    body.dark { background: #1a1a1a; color: #e0e0e0; }
    body.dark header { background: #242424; border-color: #333; }
    body.dark .card { background: #242424; border-color: #333; }
    body.dark .card:hover { border-color: #555; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    body.dark .card-title { color: #e0e0e0; }
    body.dark .card-thumb { background: #2a2a2a; }
    body.dark .stat-value { color: #ccc; }
    body.dark .stat-label { color: #666; }
    body.dark .header-left p { color: #666; }
    body.dark .search-bar input { background: #2a2a2a; border-color: #444; color: #e0e0e0; }
    body.dark #loading { color: #666; }

    @media (max-width: 700px) { .header-right { gap: 12px; } }
  </style>
</head>
<body>
<button id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">
  <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
</button>

<div class="wrap">
  <header style="position:relative;">
    <div class="header-left">
      <h1>xPrep</h1>
      <p>Portable Knowledge Infrastructure</p>
    </div>
    <div style="position:absolute;left:50%;transform:translateX(-50%);font-family:Arial,sans-serif;font-size:1.1rem;color:#888;font-weight:bold;white-space:nowrap;">Videos</div>
    <div class="header-right">
      <div class="stat-block">
        <div class="stat-label">Library</div>
        <div class="stat-value" id="subtitle">Loading...</div>
      </div>
      <a href="/" style="color:#555;text-decoration:none;font-size:0.88rem;font-weight:bold;align-self:center;">Back to Home</a>
    </div>
  </header>

  <div id="player-section">
    <video id="video-player" controls autoplay></video>
    <div id="now-playing">Playing: </div>
    <button id="close-player">Close Player</button>
  </div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Search videos..." oninput="filterVideos()">
  </div>

  <div id="loading">Loading videos...</div>
  <div id="grid"></div>
  <div id="empty">
    <svg width="48" height="48" viewBox="0 0 40 40" fill="none" stroke="#ddd" stroke-width="1.5"><rect x="4" y="10" width="24" height="18" rx="2"/><path d="M28 16l8-5v16l-8-5V16z"/></svg>
    <p>No videos found</p>
  </div>
</div>

<script>
  if (localStorage.getItem("xprep-theme") === "dark") document.body.classList.add("dark");
  function toggleTheme() {
    const dark = document.body.classList.toggle("dark");
    localStorage.setItem("xprep-theme", dark ? "dark" : "light");
    document.getElementById("icon-sun").style.display = dark ? "block" : "none";
    document.getElementById("icon-moon").style.display = dark ? "none" : "block";
  }
  (function() {
    const dark = document.body.classList.contains("dark");
    document.getElementById("icon-sun").style.display = dark ? "block" : "none";
    document.getElementById("icon-moon").style.display = dark ? "none" : "block";
  })();

  let allVideos = [];

  const iconFor = ext => {
    const icons = { mp4: "🎬", mkv: "🎞️", avi: "📽️", webm: "🎥" };
    return icons[ext.toLowerCase()] || "▶️";
  };

  function cleanTitle(filename) {
    return filename.replace(/\.[^/.]+$/, "").replace(/[._-]/g, " ").replace(/\s+/g, " ").trim();
  }

  function playVideo(filename) {
    const player = document.getElementById("video-player");
    const section = document.getElementById("player-section");
    player.src = "/api/videos/file/" + encodeURIComponent(filename);
    document.getElementById("now-playing").textContent = "Playing: " + cleanTitle(filename);
    section.style.display = "block";
    section.scrollIntoView({ behavior: "smooth" });
    player.play();
  }

  document.getElementById("close-player").addEventListener("click", () => {
    const player = document.getElementById("video-player");
    player.pause(); player.src = "";
    document.getElementById("player-section").style.display = "none";
  });

  function renderGrid(videos) {
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    grid.innerHTML = "";
    if (!videos.length) { empty.style.display = "block"; return; }
    empty.style.display = "none";
    videos.forEach(v => {
      const ext = v.split(".").pop();
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<div class="card-thumb">${iconFor(ext)}</div><div class="card-info"><div class="card-title">${cleanTitle(v)}</div><div class="card-ext">${ext}</div></div>`;
      card.addEventListener("click", () => playVideo(v));
      grid.appendChild(card);
    });
  }

  function filterVideos() {
    const q = document.getElementById("search").value.toLowerCase();
    renderGrid(allVideos.filter(v => cleanTitle(v).toLowerCase().includes(q)));
  }

  async function init() {
    try {
      const res = await fetch("/api/videos");
      const data = await res.json();
      allVideos = data.videos || [];
      document.getElementById("loading").style.display = "none";
      document.getElementById("subtitle").textContent = allVideos.length + " video" + (allVideos.length !== 1 ? "s" : "");
      renderGrid(allVideos);
    } catch(err) {
      document.getElementById("loading").textContent = "Error loading videos: " + err;
    }
  }

  init();
</script>
</body>
</html>
