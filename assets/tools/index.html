<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>xPrep Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @font-face { font-family: 'PixelifySans'; src: url('/fonts/PixelifySans-Bold.ttf') format('truetype'); font-weight: 700; }
    @font-face { font-family: 'PixelifySans'; src: url('/fonts/PixelifySans-Regular.ttf') format('truetype'); font-weight: 400; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f3f3f1; color: #161616; min-height: 100vh; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 20px; background: white; border: 1px solid #ddd;
      border-radius: 14px; padding: 20px 24px; flex-wrap: wrap;
      margin-bottom: 20px; position: relative;
    }
    .header-left h1 { font-family: 'PixelifySans', Arial, sans-serif; font-weight: 700; font-size: 2.2rem; color: #5EA259; line-height: 1; }
    .header-left p { font-size: 0.82rem; color: #aaa; margin-top: 4px; }
    .header-right { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
    .stat-block { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .stat-label { font-size: 0.72rem; color: #bbb; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 0.88rem; color: #555; font-weight: bold; }
    header h1 { font-size: 1.4rem; font-weight: bold; }
    header p { color: #888; font-size: 0.85rem; margin-top: 4px; }

    .page-wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
    .wrap {
      display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start;
    }

    .nav-col { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 20px; }
    .category { background: white; border: 1px solid #ddd; border-radius: 14px; overflow: hidden; }
    .category-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .category-header:hover { background: #fafafa; }
    .category-header.open { border-bottom: 1px solid #eee; }
    .category-title { font-size: 0.85rem; font-weight: bold; color: #161616; }
    .category-meta { font-size: 0.72rem; color: #bbb; }
    .chevron { transition: transform 0.2s; display: inline-block; font-style: normal; }
    .chevron.open { transform: rotate(90deg); }
    .category-body { display: none; }
    .category-body.open { display: block; }
    .tool-row { padding: 9px 16px; font-size: 0.82rem; color: #555; cursor: pointer; border-bottom: 1px solid #f5f5f5; transition: background 0.1s; border-left: 3px solid transparent; }
    .tool-row:last-child { border-bottom: none; }
    .tool-row:hover { background: #fafafa; color: #161616; }
    .tool-row.active { background: #f3f3f1; border-left-color: #ccc; color: #161616; font-weight: bold; }

    .panel-col { min-height: 400px; }
    #tool-panel { background: white; border: 1px solid #ddd; border-radius: 14px; padding: 24px; min-height: 400px; }
    .panel-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 360px; color: #ccc; gap: 10px; }
    .panel-empty p { font-size: 0.85rem; }
    #tool-panel-title { font-size: 1rem; font-weight: bold; color: #161616; margin-bottom: 4px; }
    #tool-panel-sub { font-size: 0.82rem; color: #aaa; margin-bottom: 20px; }

    .tool-section { margin-bottom: 20px; }
    .tool-section h3 { font-size: 0.72rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
    .input-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .input-row label { font-size: 0.82rem; color: #666; min-width: 130px; }
    .input-row input, .input-row select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.88rem; background: white; flex: 1; min-width: 100px; max-width: 200px; color: #161616; }
    .input-row input:focus, .input-row select:focus { outline: none; border-color: #5EA259; }
    .result-box { background: #f3f3f1; border: 1px solid #e0e0e0; border-radius: 10px; padding: 14px 16px; margin-top: 12px; }
    .result-value { font-size: 1.5rem; font-weight: bold; color: #161616; }
    .result-label { font-size: 0.78rem; color: #888; margin-top: 3px; }
    .calc-btn { background: #161616; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 0.88rem; cursor: pointer; margin-top: 8px; }
    .calc-btn:hover { background: #333; }
    .reference-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .reference-table th { background: #fafafa; padding: 8px 12px; text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: #aaa; border-bottom: 1px solid #eee; }
    .reference-table td { padding: 8px 12px; border-bottom: 1px solid #f5f5f5; color: #555; }
    .reference-table tr:last-child td { border-bottom: none; }
    .note { font-size: 0.75rem; color: #bbb; margin-top: 10px; line-height: 1.5; }
    textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.85rem; resize: vertical; font-family: Arial, sans-serif; color: #161616; }
    textarea:focus { outline: none; border-color: #5EA259; }
    .checklist-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f5f5f5; font-size: 0.85rem; color: #555; cursor: pointer; }
    .checklist-item:last-child { border-bottom: none; }
    .checklist-item input { width: 15px; height: 15px; accent-color: #5EA259; cursor: pointer; }
    .checklist-item.checked { color: #aaa; text-decoration: line-through; }

    #theme-toggle {
      background: white; border: 1px solid #ddd; border-radius: 8px;
      padding: 6px 8px; cursor: pointer; color: #888;
      display: flex; align-items: center; justify-content: center;
      position: fixed; top: 16px; right: 20px; z-index: 999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    #theme-toggle:hover { border-color: #aaa; }
    body.dark #theme-toggle { background: #242424; border-color: #444; color: #ccc; }
    body.dark #theme-toggle svg { stroke: #ccc; }
    #theme-toggle svg { stroke: #888; }
    body.dark { background: #1a1a1a; color: #e0e0e0; }
    body.dark header { background: #242424; border-color: #333; }
    body.dark .category { background: #242424; border-color: #333; }
    body.dark .category-header:hover { background: #2a2a2a; }
    body.dark .category-title { color: #e0e0e0; }
    body.dark .tool-row { color: #888; }
    body.dark .tool-row:hover { background: #2a2a2a; color: #e0e0e0; }
    body.dark .tool-row.active { background: #2a2a2a; border-left-color: #555; color: #e0e0e0; }
    body.dark #tool-panel { background: #242424; border-color: #333; }
    body.dark #tool-panel-title { color: #e0e0e0; }
    body.dark .input-row input, body.dark .input-row select { background: #1a1a1a; border-color: #444; color: #e0e0e0; }
    body.dark .reference-table th { background: #2a2a2a; }
    body.dark .reference-table td { border-color: #333; color: #aaa; }
    body.dark textarea { background: #1a1a1a; border-color: #444; color: #e0e0e0; }
    body.dark .result-box { background: #2a2a2a; border-color: #444; }
    body.dark .calc-btn { background: #333; }
    body.dark .calc-btn:hover { background: #444; }
    body.dark .checklist-item { color: #aaa; border-color: #333; }

    @media (max-width: 700px) {
      .wrap { grid-template-columns: 1fr; }
      .nav-col { position: static; }
    }
  </style>
</head>
<body>
<button id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">
  <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
</button>
<div class="page-wrap">
  <header style="position:relative;">
    <div class="header-left">
      <h1>xPrep</h1>
      <p>Portable Knowledge Infrastructure</p>
    </div>
    <div style="position:absolute;left:50%;transform:translateX(-50%);font-family:Arial,sans-serif;font-size:1.1rem;color:#888;font-weight:bold;white-space:nowrap;">Tools</div>
    <div class="header-right">
      <a href="/" style="color:#555;text-decoration:none;font-size:0.88rem;font-weight:bold;">Back to Home</a>
    </div>
  </header>
  <div class="wrap">
    <div class="nav-col">

      <div class="category">
        <div class="category-header" onclick="toggleCategory(this)">
          <div class="category-title">Utility</div>
          <div class="category-meta"><i class="chevron">▸</i></div>
        </div>
        <div class="category-body" id="nav-utility"></div>
      </div>

      <div class="category">
        <div class="category-header" onclick="toggleCategory(this)">
          <div class="category-title">Emergency</div>
          <div class="category-meta"><i class="chevron">▸</i></div>
        </div>
        <div class="category-body" id="nav-emergency"></div>
      </div>

      <div class="category">
        <div class="category-header" onclick="toggleCategory(this)">
          <div class="category-title">Medical</div>
          <div class="category-meta"><i class="chevron">▸</i></div>
        </div>
        <div class="category-body" id="nav-medical"></div>
      </div>

      <div class="category">
        <div class="category-header" onclick="toggleCategory(this)">
          <div class="category-title">Reference</div>
          <div class="category-meta"><i class="chevron">▸</i></div>
        </div>
        <div class="category-body" id="nav-reference"></div>
      </div>

    </div>

    <div class="panel-col">
      <div id="tool-panel">
        <div class="panel-empty">
          <svg width="48" height="48" viewBox="0 0 40 40" fill="none"><path d="M6 34l6-6m0 0l14-14m-14 14l4-4M26 6l8 8-4 4-8-8 4-4z" stroke="#161616" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="30" r="3" stroke="#161616" stroke-width="1.5"/></svg>
          <p>Select a tool from the left to get started</p>
        </div>
      </div>
    </div>
  </div>

  <script src="sections/utility.js"></script>
  <script src="sections/medical.js"></script>
  <script src="sections/emergency.js"></script>
  <script src="sections/reference.js"></script>

  <script>
    if (localStorage.getItem("xprep-theme") === "dark") document.body.classList.add("dark");

    function toggleTheme() {
      const dark = document.body.classList.toggle("dark");
      localStorage.setItem("xprep-theme", dark ? "dark" : "light");
      document.getElementById("icon-sun").style.display = dark ? "block" : "none";
      document.getElementById("icon-moon").style.display = dark ? "none" : "block";
    }
    (function() {
      const dark = document.body.classList.contains("dark");
      document.getElementById("icon-sun").style.display = dark ? "block" : "none";
      document.getElementById("icon-moon").style.display = dark ? "none" : "block";
    })();

    window.onerror = function(msg, src, line) {
      console.error("JS Error:", msg, "at", src, "line", line);
    };

    const ALL_TOOLS = {
      ...window.TOOLS_UTILITY,
      ...window.TOOLS_MEDICAL,
      ...window.TOOLS_EMERGENCY,
      ...window.TOOLS_REFERENCE
    };

    const NAV_SECTIONS = {
      utility:   Object.keys(window.TOOLS_UTILITY),
      emergency: Object.keys(window.TOOLS_EMERGENCY),
      medical:   Object.keys(window.TOOLS_MEDICAL),
      reference: Object.keys(window.TOOLS_REFERENCE)
    };

    // Build nav
    Object.entries(NAV_SECTIONS).forEach(([section, ids]) => {
      const container = document.getElementById("nav-" + section);
      ids.forEach(id => {
        const tool = ALL_TOOLS[id];
        const row = document.createElement("div");
        row.className = "tool-row";
        row.textContent = tool.title;
        row.onclick = () => openTool(id, row);
        container.appendChild(row);
      });
    });

    function toggleCategory(header) {
      const body = header.nextElementSibling;
      const isOpen = body.classList.contains("open");

      // Close all categories first
      document.querySelectorAll(".category-body").forEach(b => b.classList.remove("open"));
      document.querySelectorAll(".category-header").forEach(h => h.classList.remove("open"));
      document.querySelectorAll(".chevron").forEach(c => c.classList.remove("open"));

      // Open clicked one only if it was closed
      if (!isOpen) {
        body.classList.add("open");
        header.classList.add("open");
        header.querySelector(".chevron").classList.add("open");
      }
    }

    let activeRow = null;

    function openTool(id, row) {
      if (activeRow) activeRow.classList.remove("active");
      activeRow = row;
      row.classList.add("active");
      const tool = ALL_TOOLS[id];
      const panel = document.getElementById("tool-panel");
      panel.innerHTML = `<div id="tool-panel-title">${tool.title}</div><div id="tool-panel-sub">${tool.sub}</div><div id="tool-panel-body">${tool.html}</div>`;
      if (id === 'unit-converter') setTimeout(ucInit, 50);
      if (id === 'currency') setTimeout(ccPopulate, 50);
      if (id === 'time-sun') { setTimeout(tsPopulateCities, 50); setTimeout(updateClock, 50); }
    }
  </script>
</div>
</body>
</html>
