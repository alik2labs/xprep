<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Calculator — xPrep</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    @font-face { font-family: "PixelifySans"; src: url("/fonts/PixelifySans-Bold.ttf") format("truetype"); font-weight: 700; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, Arial, sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 0; flex-shrink: 0; }
    .logo { font-family: "PixelifySans", Arial, sans-serif; font-weight: 700; font-size: 1.2rem; color: #5EA259; }
    .back-link { color: #666; text-decoration: none; font-size: 0.82rem; }

    .display { padding: 0 20px 8px; text-align: right; flex-shrink: 0; }
    .display-expr { font-size: 0.85rem; color: #555; min-height: 18px; }
    .display-main { font-size: 5rem; font-weight: 200; line-height: 1.1; overflow: hidden; }

    .keypad { flex: 1; display: flex; flex-direction: column; padding: 0 8px 8px; gap: 0; justify-content: flex-end; }

    /* Scientific rows */
    .sci-section { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
    .sci-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
    .btn-sci {
      background: #1c1c1e; color: #fff; border: none; border-radius: 50%;
      aspect-ratio: 1/1; font-size: 0.68rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      width: 100%;
    }
    .btn-sci.green { color: #5EA259; }
    .btn-sci:active { filter: brightness(1.6); }

    /* Standard rows */
    .std-section { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .std-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .std-row.last { grid-template-columns: repeat(4, 1fr); }
    .btn-std {
      background: #333; color: #fff; border: none; border-radius: 999px;
      height: 11.5vw; font-size: 1.4rem; font-weight: 400; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      width: 100%;
    }
    .btn-std.gray { background: #636366; }
    .btn-std.op   { background: #5EA259; }
    .btn-std:active { filter: brightness(1.5); }

    /* Desktop */
    @media (min-width: 700px) {
      body { background: #111; align-items: center; justify-content: center; overflow: auto; height: auto; min-height: 100vh; }
      .calc-wrap { background: #1c1c1e; border-radius: 20px; width: 720px; padding-bottom: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
      .display-main { font-size: 4rem; }
      .keypad { flex: none; padding: 0 16px 0; }
      .sci-section { display: none; }
      .std-section { gap: 10px; }
      .std-row { gap: 10px; }
      .btn-std { height: 64px; font-size: 1.1rem; }
      .desk-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; margin-bottom: 10px; }
      .btn-d { background: #1c1c1e; color: #fff; border: none; border-radius: 50%; aspect-ratio: 1/1; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 100%; }
      .btn-d.green { color: #5EA259; }
      .btn-d.gray { background: #636366; border-radius: 999px; aspect-ratio: unset; height: 64px; font-size: 1.1rem; }
      .btn-d.dark { background: #333; border-radius: 999px; aspect-ratio: unset; height: 64px; font-size: 1.1rem; }
      .btn-d.op { background: #5EA259; border-radius: 999px; aspect-ratio: unset; height: 64px; font-size: 1.1rem; }
      .btn-d.zero { border-radius: 999px; aspect-ratio: unset; height: 64px; font-size: 1.1rem; background: #333; padding-left: 22px; justify-content: flex-start; }
      .btn-d:active { filter: brightness(1.5); }
      .std-section { display: none; }
      .desk-section { display: block !important; }
    }
    .desk-section { display: none; }
  </style>
</head>
<body>
<div class="calc-wrap">
  <div class="top-bar">
    <span class="logo">xPrep</span>
    <a href="/" class="back-link">&#8592; Home</a>
  </div>
  <div class="display">
    <div class="display-expr" id="expr"></div>
    <div class="display-main" id="disp">0</div>
  </div>

  <div class="keypad">

    <!-- DESKTOP LAYOUT -->
    <div class="desk-section">
      <div class="desk-grid">
        <button class="btn-d" onclick="press('(')">(</button>
        <button class="btn-d" onclick="press(')')">)</button>
        <button class="btn-d" onclick="mc()">mc</button>
        <button class="btn-d" onclick="mplus()">m+</button>
        <button class="btn-d" onclick="mminus()">m-</button>
        <button class="btn-d" onclick="mr()">mr</button>
        <button class="btn-d gray" id="acBtnD" onclick="ac()">AC</button>
        <button class="btn-d gray" onclick="percent()">%</button>
        <button class="btn-d gray" onclick="backspace()">⌫</button>
        <button class="btn-d op" onclick="pressOp('/')">÷</button>

        <button class="btn-d green" id="d2nd" onclick="toggle2nd()">2<sup>nd</sup></button>
        <button class="btn-d" id="dX2" onclick="sciOp('sq')">x<sup>2</sup></button>
        <button class="btn-d" id="dX3" onclick="sciOp('cb')">x<sup>3</sup></button>
        <button class="btn-d" id="dXY" onclick="sciOp('pow')">x<sup>y</sup></button>
        <button class="btn-d" id="dEX" onclick="sciOp('exp')">e<sup>x</sup></button>
        <button class="btn-d" id="d10X" onclick="sciOp('10x')">10<sup>x</sup></button>
        <button class="btn-d dark" onclick="pressNum('7')">7</button>
        <button class="btn-d dark" onclick="pressNum('8')">8</button>
        <button class="btn-d dark" onclick="pressNum('9')">9</button>
        <button class="btn-d op" onclick="pressOp('*')">×</button>

        <button class="btn-d" onclick="sciOp('inv')"><sup>1</sup>/<sub>x</sub></button>
        <button class="btn-d" onclick="sciOp('sqrt')"><sup>2</sup>√x</button>
        <button class="btn-d" onclick="sciOp('cbrt')"><sup>3</sup>√x</button>
        <button class="btn-d" onclick="sciOp('yrt')"><sup>y</sup>√x</button>
        <button class="btn-d" onclick="sciOp('ln')">ln</button>
        <button class="btn-d" onclick="sciOp('log')">log<sub>10</sub></button>
        <button class="btn-d dark" onclick="pressNum('4')">4</button>
        <button class="btn-d dark" onclick="pressNum('5')">5</button>
        <button class="btn-d dark" onclick="pressNum('6')">6</button>
        <button class="btn-d op" onclick="pressOp('-')">−</button>

        <button class="btn-d" onclick="sciOp('fact')">x!</button>
        <button class="btn-d" id="dSin" onclick="sciOp('sin')">sin</button>
        <button class="btn-d" id="dCos" onclick="sciOp('cos')">cos</button>
        <button class="btn-d" id="dTan" onclick="sciOp('tan')">tan</button>
        <button class="btn-d" onclick="pressConst('e')"><i>e</i></button>
        <button class="btn-d" onclick="pressEE()">EE</button>
        <button class="btn-d dark" onclick="pressNum('1')">1</button>
        <button class="btn-d dark" onclick="pressNum('2')">2</button>
        <button class="btn-d dark" onclick="pressNum('3')">3</button>
        <button class="btn-d op" onclick="pressOp('+')">+</button>

        <button class="btn-d" onclick="rand()">Rand</button>
        <button class="btn-d" id="dSinh" onclick="sciOp('sinh')">sinh</button>
        <button class="btn-d" id="dCosh" onclick="sciOp('cosh')">cosh</button>
        <button class="btn-d" id="dTanh" onclick="sciOp('tanh')">tanh</button>
        <button class="btn-d" onclick="pressConst('pi')">π</button>
        <button class="btn-d" id="dRad" onclick="toggleRad()">Rad</button>
        <button class="btn-d zero" onclick="pressNum('0')">0</button>
        <button class="btn-d gray" onclick="plusminus()">+/−</button>
        <button class="btn-d dark" onclick="pressDot()">.</button>
        <button class="btn-d op" onclick="equals()">=</button>
      </div>
    </div>

    <!-- MOBILE LAYOUT -->
    <div class="sci-section">
      <div class="sci-row">
        <button class="btn-sci" onclick="press('(')">(</button>
        <button class="btn-sci" onclick="press(')')">)</button>
        <button class="btn-sci" onclick="mc()">mc</button>
        <button class="btn-sci" onclick="mplus()">m+</button>
        <button class="btn-sci" onclick="mminus()">m-</button>
        <button class="btn-sci" onclick="mr()">mr</button>
      </div>
      <div class="sci-row">
        <button class="btn-sci green" id="m2nd" onclick="toggle2nd()">2<sup>nd</sup></button>
        <button class="btn-sci" id="mX2" onclick="sciOp('sq')">x<sup>2</sup></button>
        <button class="btn-sci" id="mX3" onclick="sciOp('cb')">x<sup>3</sup></button>
        <button class="btn-sci" id="mXY" onclick="sciOp('pow')">x<sup>y</sup></button>
        <button class="btn-sci" id="mEX" onclick="sciOp('exp')">e<sup>x</sup></button>
        <button class="btn-sci" id="m10X" onclick="sciOp('10x')">10<sup>x</sup></button>
      </div>
      <div class="sci-row">
        <button class="btn-sci" onclick="sciOp('inv')"><sup>1</sup>/<sub>x</sub></button>
        <button class="btn-sci" onclick="sciOp('sqrt')"><sup>2</sup>√x</button>
        <button class="btn-sci" onclick="sciOp('cbrt')"><sup>3</sup>√x</button>
        <button class="btn-sci" onclick="sciOp('yrt')"><sup>y</sup>√x</button>
        <button class="btn-sci" onclick="sciOp('ln')">ln</button>
        <button class="btn-sci" onclick="sciOp('log')">log<sub>10</sub></button>
      </div>
      <div class="sci-row">
        <button class="btn-sci" onclick="sciOp('fact')">x!</button>
        <button class="btn-sci" id="mSin" onclick="sciOp('sin')">sin</button>
        <button class="btn-sci" id="mCos" onclick="sciOp('cos')">cos</button>
        <button class="btn-sci" id="mTan" onclick="sciOp('tan')">tan</button>
        <button class="btn-sci" onclick="pressConst('e')"><i>e</i></button>
        <button class="btn-sci" onclick="pressEE()">EE</button>
      </div>
      <div class="sci-row">
        <button class="btn-sci" onclick="rand()">Rand</button>
        <button class="btn-sci" id="mSinh" onclick="sciOp('sinh')">sinh</button>
        <button class="btn-sci" id="mCosh" onclick="sciOp('cosh')">cosh</button>
        <button class="btn-sci" id="mTanh" onclick="sciOp('tanh')">tanh</button>
        <button class="btn-sci" onclick="pressConst('pi')">π</button>
        <button class="btn-sci" id="mRad" onclick="toggleRad()">Rad</button>
      </div>
    </div>

    <div class="std-section">
      <div class="std-row">
        <button class="btn-std gray" id="acBtn" onclick="ac()">AC</button>
        <button class="btn-std gray" onclick="percent()">%</button>
        <button class="btn-std gray" onclick="backspace()" style="font-size:1.1rem;">⌫</button>
        <button class="btn-std op" onclick="pressOp('/')">÷</button>
      </div>
      <div class="std-row">
        <button class="btn-std" onclick="pressNum('7')">7</button>
        <button class="btn-std" onclick="pressNum('8')">8</button>
        <button class="btn-std" onclick="pressNum('9')">9</button>
        <button class="btn-std op" onclick="pressOp('*')">×</button>
      </div>
      <div class="std-row">
        <button class="btn-std" onclick="pressNum('4')">4</button>
        <button class="btn-std" onclick="pressNum('5')">5</button>
        <button class="btn-std" onclick="pressNum('6')">6</button>
        <button class="btn-std op" onclick="pressOp('-')">−</button>
      </div>
      <div class="std-row">
        <button class="btn-std" onclick="pressNum('1')">1</button>
        <button class="btn-std" onclick="pressNum('2')">2</button>
        <button class="btn-std" onclick="pressNum('3')">3</button>
        <button class="btn-std op" onclick="pressOp('+')">+</button>
      </div>
      <div class="std-row last">
        <button class="btn-std gray" onclick="plusminus()">+/−</button>
        <button class="btn-std" onclick="pressNum('0')">0</button>
        <button class="btn-std" onclick="pressDot()">.</button>
        <button class="btn-std op" onclick="equals()">=</button>
      </div>
    </div>

  </div>
</div>

<script>
let disp="0",expr="",op=null,prev=null,newNum=true;
let mem=0,isRad=true,is2nd=false,pendingPow=false,pendingYrt=false;

function updateDisplay(){
  const el=document.getElementById("disp");
  el.textContent=disp;
  const len=disp.replace("-","").length;
  el.style.fontSize=len>14?"1.8rem":len>11?"2.5rem":len>8?"3.5rem":"5rem";
  document.getElementById("expr").textContent=expr;
  const lbl=disp==="0"&&prev===null?"AC":"C";
  ["acBtn","acBtnD"].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=lbl;});
}
function pressNum(n){
  if(newNum){disp=n;newNum=false;}
  else if(disp.length<15)disp=disp==="0"?n:disp+n;
  updateDisplay();
}
function pressDot(){
  if(newNum){disp="0.";newNum=false;}
  else if(!disp.includes("."))disp+=".";
  updateDisplay();
}
function pressOp(o){
  if(prev!==null&&!newNum){prev=compute(prev,parseFloat(disp),op);disp=fmt(prev);}
  else prev=parseFloat(disp);
  op=o;newNum=true;
  expr=fmt(prev)+" "+({"+":"+","-":"−","*":"×","/":"÷"}[o]||o);
  updateDisplay();
}
function compute(a,b,o){
  if(o==="+")return a+b;if(o==="-")return a-b;
  if(o==="*")return a*b;if(o==="/")return b===0?NaN:a/b;return b;
}
function equals(){
  if(op===null)return;
  const b=parseFloat(disp);
  const r=compute(prev,b,op);
  expr=fmt(prev)+" "+({"+":"+","-":"−","*":"×","/":"÷"}[op]||op)+" "+fmt(b)+" =";
  disp=fmt(r);prev=null;op=null;newNum=true;updateDisplay();
}
function ac(){
  if(disp!=="0"||prev!==null){disp="0";newNum=true;updateDisplay();return;}
  disp="0";expr="";op=null;prev=null;newNum=true;pendingPow=false;pendingYrt=false;updateDisplay();
}
function backspace(){if(!newNum&&disp!=="0"){disp=disp.length>1?disp.slice(0,-1):"0";updateDisplay();}}
function plusminus(){disp=fmt(parseFloat(disp)*-1);updateDisplay();}
function percent(){disp=fmt(prev!==null?prev*parseFloat(disp)/100:parseFloat(disp)/100);newNum=true;updateDisplay();}
function fmt(n){
  if(isNaN(n))return"Error";
  if(!isFinite(n))return n>0?"∞":"-∞";
  if(Math.abs(n)>1e12||(Math.abs(n)<1e-9&&n!==0))return n.toExponential(6);
  return String(parseFloat(n.toPrecision(12)));
}
function toRad(v){return isRad?v:v*Math.PI/180;}
function sciOp(fn){
  const v=parseFloat(disp);let r;
  if(fn==="sq")r=v*v;
  else if(fn==="cb")r=v*v*v;
  else if(fn==="pow"){pendingPow=true;prev=v;op="pow";newNum=true;expr=fmt(v)+" ^";updateDisplay();return;}
  else if(fn==="exp")r=Math.exp(v);
  else if(fn==="10x")r=Math.pow(10,v);
  else if(fn==="inv")r=1/v;
  else if(fn==="sqrt")r=Math.sqrt(v);
  else if(fn==="cbrt")r=Math.cbrt(v);
  else if(fn==="yrt"){pendingYrt=true;prev=v;op="yrt";newNum=true;expr=fmt(v)+" ʸ√";updateDisplay();return;}
  else if(fn==="ln")r=Math.log(v);
  else if(fn==="log")r=Math.log10(v);
  else if(fn==="fact"){if(!Number.isInteger(v)||v<0)return;r=1;for(let i=2;i<=Math.min(v,170);i++)r*=i;if(v>170)r=Infinity;}
  else if(fn==="sin")r=is2nd?Math.asin(v)*(isRad?1:180/Math.PI):Math.sin(toRad(v));
  else if(fn==="cos")r=is2nd?Math.acos(v)*(isRad?1:180/Math.PI):Math.cos(toRad(v));
  else if(fn==="tan")r=is2nd?Math.atan(v)*(isRad?1:180/Math.PI):Math.tan(toRad(v));
  else if(fn==="sinh")r=is2nd?Math.asinh(v):Math.sinh(v);
  else if(fn==="cosh")r=is2nd?Math.acosh(v):Math.cosh(v);
  else if(fn==="tanh")r=is2nd?Math.atanh(v):Math.tanh(v);
  if(pendingPow&&fn!=="pow"){r=Math.pow(prev,v);pendingPow=false;prev=null;op=null;}
  if(pendingYrt&&fn!=="yrt"){r=Math.pow(prev,1/v);pendingYrt=false;prev=null;op=null;}
  if(r===undefined)return;
  disp=fmt(r);newNum=true;expr="";updateDisplay();
}
function pressConst(c){disp=c==="pi"?fmt(Math.PI):fmt(Math.E);newNum=true;updateDisplay();}
function pressEE(){if(!disp.includes("e"))disp+="e+";updateDisplay();}
function rand(){disp=fmt(Math.random());newNum=true;updateDisplay();}
function mc(){mem=0;}function mplus(){mem+=parseFloat(disp);}
function mminus(){mem-=parseFloat(disp);}function mr(){disp=fmt(mem);newNum=true;updateDisplay();}
function toggleRad(){
  isRad=!isRad;
  ["mRad","dRad"].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=isRad?"Rad":"Deg";});
}
function toggle2nd(){
  is2nd=!is2nd;
  const ids=[["m2nd","d2nd"],["mSin","dSin"],["mCos","dCos"],["mTan","dTan"],
    ["mSinh","dSinh"],["mCosh","dCosh"],["mTanh","dTanh"]];
  ids.forEach(([a,b])=>[a,b].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    if(id.includes("2nd")){el.style.background=is2nd?"#5EA259":"";el.style.color=is2nd?"#fff":"#5EA259";}
    else if(id.includes("Sin"))el.textContent=is2nd?"sin⁻¹":"sin";
    else if(id.includes("Cos"))el.textContent=is2nd?"cos⁻¹":"cos";
    else if(id.includes("Tan"))el.textContent=is2nd?"tan⁻¹":"tan";
    else if(id.includes("Sinh"))el.textContent=is2nd?"sinh⁻¹":"sinh";
    else if(id.includes("Cosh"))el.textContent=is2nd?"cosh⁻¹":"cosh";
    else if(id.includes("Tanh"))el.textContent=is2nd?"tanh⁻¹":"tanh";
  }));
}
function press(c){if(newNum){disp=c;newNum=false;}else disp+=c;updateDisplay();}
document.addEventListener("keydown",e=>{
  if(e.key>="0"&&e.key<="9")pressNum(e.key);
  else if(e.key===".")pressDot();
  else if(["+","-","*","/"].includes(e.key))pressOp(e.key);
  else if(e.key==="Enter"||e.key==="=")equals();
  else if(e.key==="Backspace")backspace();
  else if(e.key==="Escape")ac();
});
updateDisplay();
</script>
</body>
</html>
