<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Calculator — xPrep</title>
  <!-- CalcSS3 original layout CSS -->
  <link href="/tools/CalcSS3.css" rel="stylesheet">
  <style>
    @font-face { font-family: "PixelifySans"; src: url("/fonts/PixelifySans-Bold.ttf") format("truetype"); font-weight: 700; }
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, Arial, Helvetica, sans-serif;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      flex-shrink: 0;
    }
    .logo { font-family: "PixelifySans", Arial, sans-serif; font-weight: 700; font-size: 1.1rem; color: #5EA259; }
    .back-link { color: #666; text-decoration: none; font-size: 0.82rem; }
    .back-link:hover { color: #aaa; }

    /* ===== xPrep Theme Overrides for CalcSS3 ===== */

    .calc-main {
      background: #1c1c1e !important;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6) !important;
      border-radius: 16px !important;
      padding: 12px 10px 16px !important;
    }

    /* Display */
    .calc-display {
      background: #000 !important;
      border-radius: 10px !important;
      box-shadow: none !important;
      color: #fff !important;
      height: auto !important;
      min-height: 70px !important;
      padding: 10px 12px 6px !important;
      line-height: 1.1 !important;
      font-size: 42px !important;
      text-shadow: none !important;
    }
    .calc-rad {
      color: #5EA259 !important;
      font-size: 11px !important;
      bottom: 4px !important;
    }
    .calc-hold {
      color: #444 !important;
      font-size: 9px !important;
    }
    .calc-buttons {
      opacity: 0.6 !important;
    }
    .calc-buttons div {
      background: #333 !important;
      border-radius: 50% !important;
      color: #aaa !important;
      border: 1px solid #444 !important;
    }
    .calc-buttons div:hover {
      background: #444 !important;
      color: #fff !important;
    }

    /* Left sci panel buttons */
    .calc-left > div {
      background: #2c2c2e !important;
      border-radius: 50% !important;
      box-shadow: none !important;
      border: none !important;
    }
    .calc-left > div > div {
      color: #e0e0e0 !important;
      text-shadow: none !important;
      font-size: 13px !important;
    }
    .calc-left > div:active,
    .calc-left .calc-press {
      background: #444 !important;
    }
    .calc-left .calc-active {
      background: #2c2c2e !important;
    }
    .calc-left .calc-active > div {
      color: #5EA259 !important;
    }
    .calc-left .calc-second > div {
      color: #5EA259 !important;
      font-size: 11px !important;
    }

    /* Right standard buttons */
    .calc-right > div {
      border-radius: 50% !important;
      box-shadow: none !important;
      border: none !important;
    }

    /* Number buttons */
    .calc-right .calc-black {
      background: #333 !important;
    }
    .calc-right .calc-black > div {
      color: #fff !important;
      text-shadow: none !important;
      font-size: 20px !important;
    }

    /* Gray buttons (AC, +/-, %) */
    .calc-right .calc-brown {
      background: #636366 !important;
      box-shadow: none !important;
    }
    .calc-right .calc-brown > div {
      color: #fff !important;
      text-shadow: none !important;
    }

    /* Orange = green for xPrep */
    .calc-right .calc-orange {
      background: #5EA259 !important;
      box-shadow: none !important;
    }
    .calc-right .calc-orange > div {
      color: #fff !important;
      text-shadow: none !important;
    }

    /* Zero button */
    .calc-right .calc-zero {
      border-radius: 999px !important;
    }
    .calc-right .calc-zero > div {
      color: #fff !important;
      text-shadow: none !important;
      font-size: 20px !important;
    }

    /* Active states */
    .calc-right .calc-black:active,
    .calc-right .calc-black.calc-press { background: #555 !important; }
    .calc-right .calc-brown:active,
    .calc-right .calc-brown.calc-press { background: #888 !important; }
    .calc-right .calc-orange:active,
    .calc-right .calc-orange.calc-press { background: #4a8a46 !important; }

    /* Eq button */
    .calc-right .calc-eq {
      border-radius: 999px !important;
    }
    .calc-right .calc-eq .calc-down {
      font-size: 22px !important;
      color: #fff !important;
    }

    /* Separator line */
    .calc-left > div:last-child,
    .calc-left > div:nth-child(4n) {
      /* remove any separator styling */
    }
  </style>
</head>
<body>

<div class="top-bar">
  <span class="logo">xPrep</span>
  <a href="/" class="back-link">&#8592; Home</a>
</div>

<div class="calc-main">
  <div class="calc-display">
    <span>0</span>
    <div class="calc-rad">Rad</div>
    <div class="calc-hold"></div>
    <div class="calc-buttons">
      <div class="calc-info">?</div>
      <div class="calc-smaller">&gt;</div>
      <div class="calc-ln">.</div>
    </div>
  </div>

  <div class="calc-left">
    <div><div>2nd</div></div>
    <div><div>(</div></div>
    <div><div>)</div></div>
    <div><div>%</div></div>
    <div><div>1/x</div></div>
    <div><div>x<sup>2</sup></div></div>
    <div><div>x<sup>3</sup></div></div>
    <div><div>y<sup>x</sup></div></div>
    <div><div>x!</div></div>
    <div><div>&radic;</div></div>
    <div><div class="calc-radxy"><sup>x</sup><em>&radic;</em><span>y</span></div></div>
    <div><div>log</div></div>
    <div><div>sin</div></div>
    <div><div>cos</div></div>
    <div><div>tan</div></div>
    <div><div>ln</div></div>
    <div><div>sinh</div></div>
    <div><div>cosh</div></div>
    <div><div>tanh</div></div>
    <div><div>e<sup>x</sup></div></div>
    <div><div>Deg</div></div>
    <div><div>&pi;</div></div>
    <div><div>EE</div></div>
    <div><div>Rand</div></div>
  </div>

  <div class="calc-right">
    <div><div>mc</div></div>
    <div><div>m+</div></div>
    <div><div>m-</div></div>
    <div><div>mr</div></div>
    <div class="calc-brown"><div>AC</div></div>
    <div class="calc-brown"><div>+/&#8211;</div></div>
    <div class="calc-brown calc-f19"><div>&divide;</div></div>
    <div class="calc-brown calc-f21"><div>&times;</div></div>
    <div class="calc-black"><div>7</div></div>
    <div class="calc-black"><div>8</div></div>
    <div class="calc-black"><div>9</div></div>
    <div class="calc-brown calc-f18"><div>&#8211;</div></div>
    <div class="calc-black"><div>4</div></div>
    <div class="calc-black"><div>5</div></div>
    <div class="calc-black"><div>6</div></div>
    <div class="calc-brown calc-f18"><div>+</div></div>
    <div class="calc-black"><div>1</div></div>
    <div class="calc-black"><div>2</div></div>
    <div class="calc-black"><div>3</div></div>
    <div class="calc-blank"><textarea></textarea></div>
    <div class="calc-orange calc-eq calc-f17"><div><div class="calc-down">=</div></div></div>
    <div class="calc-black calc-zero"><div><span>0</span></div></div>
    <div class="calc-black calc-f21"><div>.</div></div>
  </div>
</div>

<script src="/tools/CalcSS3.js"></script>
</body>
</html>
